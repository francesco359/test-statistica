uote cumulate di ammontare con classi aggregate.","warning":"Il risultato è approssimato, non il totale esatto dei valori individuali."},{"chapter":8,"group":"Dati raggruppati","title":"Gini approssimato per classi","formula":"R ≈ 1 − Σ(qᵢ+qᵢ₊₁)(pᵢ₊₁−pᵢ)","explain":"La somma descrive l’area sotto la curva di Lorenz a tratti lineari.","warning":"Dati raggruppati nascondono la disuguaglianza dentro ogni classe."},{"chapter":8,"group":"Disuguaglianza","title":"Rapporto interquintilico S80/S20","formula":"S80/S20 = reddito totale quinto più ricco / reddito totale quinto più povero","explain":"Confronta le quote del 20% più ricco e del 20% più povero.","warning":"Non sottrarre le due quote: bisogna dividerle."},{"chapter":9,"group":"Redditi e consumi","title":"Reddito medio","formula":"ȳ = reddito totale / numero famiglie","explain":"Sintetizza il reddito medio del collettivo osservato.","warning":"La media può superare la mediana in distribuzioni con redditi molto elevati."},{"chapter":9,"group":"Redditi e consumi","title":"Reddito pro capite familiare","formula":"Reddito pro capite = reddito familiare / componenti","explain":"Divide il reddito complessivo per la numerosità dei componenti.","warning":"Non considera le economie di scala familiari."},{"chapter":9,"group":"Redditi e consumi","title":"Scala OCSE modificata","formula":"e = 1 + 0,5×(altri componenti ≥14 anni) + 0,3×(componenti <14 anni)","explain":"Il peso del primo adulto è 1; agli altri adulti/ragazzi almeno quattordicenni si assegna 0,5.","warning":"Un bambino di 14 anni pesa 0,5, non 0,3."},{"chapter":9,"group":"Redditi e consumi","title":"Reddito equivalente","formula":"Reddito equivalente = reddito familiare / e","explain":"Permette il confronto tra famiglie di dimensione/composizione diversa.","warning":"Il risultato non è il reddito effettivo ricevuto da ciascun componente."},{"chapter":9,"group":"Povertà","title":"Incidenza della povertà","formula":"H = famiglie povere / famiglie totali × 100","explain":"Percentuale di famiglie classificate povere rispetto alla soglia.","warning":"Non confondere la percentuale di poveri con l’intensità della povertà."},{"chapter":9,"group":"Povertà","title":"Intensità della povertà","formula":"I = (z − ȳpoveri) / z","explain":"z = soglia di povertà; ȳpoveri = reddito o consumo medio delle sole famiglie povere.","warning":"Usa l’ammontare medio dei poveri, non di tutta la popolazione."},{"chapter":9,"group":"Povertà","title":"Ricavare il consumo medio dei poveri","formula":"ȳpoveri = z × (1 − I)","explain":"Permette di risalire alla media dei poveri conoscendo soglia e intensità, con I in forma decimale.","warning":"Se I = 20%, scrivi I = 0,20."},{"chapter":9,"group":"Povertà","title":"Soglia relativa Istat (famiglia di 2 persone)","formula":"z₂ = spesa media mensile pro capite","explain":"Nella metodologia storica presentata dalla dispensa la soglia per due persone è la spesa media pro capite.","warning":"Per composizioni familiari differenti occorre una scala di equivalenza."},{"chapter":9,"group":"Povertà","title":"Soglia relativa Banca d’Italia","formula":"z = 0,50 × mediana del reddito equivalente","explain":"Soglia della povertà relativa nell’indagine Banca d’Italia descritta nel capitolo.","warning":"Da non confondere con la soglia EU-SILC pari al 60%."},{"chapter":9,"group":"Condizioni di vita EU-SILC","title":"Rischio di povertà EU-SILC","formula":"z = 0,60 × mediana del reddito equivalente","explain":"Soglia per il rischio di povertà secondo l’indicatore europeo esposto nella dispensa.","warning":"Rischio di povertà e povertà assoluta non sono sinonimi."},{"chapter":9,"group":"Condizioni di vita EU-SILC","title":"Intensità lavorativa della famiglia","formula":"IL = mesi effettivamente lavorati / mesi potenzialmente lavorabili","explain":"Nel criterio storico illustrato nella dispensa, un valore inferiore a 0,20 identifica bassa intensità lavorativa, entro la popolazione di riferimento prevista.","warning":"Rispetta le function migratePriorData(){
 let changed=false;
 for(const name of (db.profiles||[])){
  const old=db.history?.[name]||[],clean=[];
  for(const record of old){
   if(!Array.isArray(record.items)) {changed=true;continue}
   const items=record.items.filter(it=>it&&qById[it.qid]&&it.chapter===qById[it.qid].chapter);
   if(!items.length){changed=true;continue}
   if(items.length!==record.items.length){record.items=items;record.correct=items.filter(it=>it.correct).length;changed=true}
   clean.push(record);
  }
  if(clean.length!==old.length)changed=true;
  db.history[name]=clean;
  const d=db.drafts?.[name];
  if(d?.items){const valid=d.items.filter(it=>qById[it.qid]);if(valid.length!==d.items.length){changed=true;if(valid.length){d.items=valid;d.index=Math.min(d.index||0,valid.length-1)}else delete db.drafts[name]}}
  if(db.read?.[name]){const valid=db.read[name].filter(n=>Number.isInteger(n)&&n>=1&&n<=9);if(valid.length!==db.read[name].length){db.read[name]=valid;changed=true}}
 }
 if(changed)save();
}

function getChapterStats(records=profileHistory()){
 const s=Object.fromEntries(LESSONS.map(c=>[c.chapter,{chapter:c.chapter,total:0,wrong:0,correct:0}]));
 for(const r of records) for(const item of r.items||[]) {const c=s[item.chapter];if(!c)continue;c.total++;if(item.correct)c.correct++;else c.wrong++}
 return Object.values(s).map(x=>({...x,error:pct(x.wrong,x.total)}));
}
function getMistakes(records=profileHistory()){
 const all=new Map();for(const r of records)for(const x of (r.items||[])){
    const old=all.get(x.qid)||{qid:x.qid,chapter:x.chapter,misses:0,lastAnswer:null,lastAt:r.date};
    if(!x.correct){old.misses++;old.lastAnswer=x.selected;old.lastAt=r.date}all.set(x.qid,old)
 }
 return [...all.values()].filter(x=>x.misses).sort((a,b)=>b.misses-a.misses||new Date(b.lastAt)-new Date(a.lastAt));
}
function buildTrendSVG(records,height=170){
 const rs=[...records].slice(-12);const W=560,H=height,pad={l:26,r:14,t:15,b:27};
 if(!rs.length)return '<div class="empty-state"><div class="bigicon">⌁</div>Il grafico apparirà dopo la prima simulazione.</div>';
 const X=i=>pad.l+(rs.length===1?.5:i/(rs.length-1))*(W-pad.l-pad.r);const Y=score=>pad.t+(100-score)/100*(H-pad.t-pad.b);
 const pts=rs.map((r,i)=>[X(i),Y(pct(r.correct,r.items.length))]);
 const path=pts.map(([x,y],i)=>(i?'L':'M')+`${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
 const grid=[0,25,50,75,100].map(v=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2eae5" stroke-dasharray="3 4"/><text x="${pad.l-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#92a6a0">${v}</text>`).join('');
 return `<div class="mini-graph"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Percentuali di risposte corrette per simulazione: ${rs.map(r=>pct(r.correct,r.items.length)+'%').join(', ')}"><g>${grid}</g><path d="${path}" fill="none" stroke="#1b8a76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="#1b8a76" stroke-width="3"><title>${dateFmt(rs[i].date)}: ${pct(rs[i].correct,rs[i].items.length)}%</title></circle>`).join('')}<text x="${pad.l}" y="${H-3}" font-size="11" fill="#98aaa4">Tentativi precedenti</text><text x="${W-pad.r}" y="${H-3}" font-size="11" fill="#98aaa4" text-anchor="end">Più recenti</text></svg></div>`;
}

function chooseQuestions(){let pool=[...QUESTION_BANK];let label='Esame completo · Capitoli 1–9';if(setup.mode==='syllabus'){pool=pool.filter(q=>q.sourceType!=='archived');label='Quesiti originali · Capitoli 1–9'}else if(setup.mode==='archived'){pool=pool.filter(q=>q.sourceType==='archived');label='Prove storiche · PDF e fotografie'}else if(setup.mode==='chapter'){pool=pool.filter(q=>q.chapter===setup.chapter);label=`Capitolo ${setup.chapter}`}
 else if(setup.mode==='mistakes'){let ids=new Set(getMistakes().map(x=>x.qid));pool=pool.filter(q=>ids.has(q.id));label='Ripasso degli errori'}
 else if(setup.mode==='weak'){const ranked=getChapterStats().filter(s=>s.total>=2).sort((a,b)=>b.error-a.error);if(ranked.length){let focus=new Set(ranked.slice(0,3).map(x=>x.chapter));pool=pool.filter(q=>focus.has(q.chapter));label=`Capitoli da rinforzare · ${[...focus].join(', ')}`}else {label='Allenamento mirato · tutti i capitoli'}}
 const desired=Math.min(setup.length,pool.length);if(!desired)return {items:[],label};
 const recent=new Set(profileHistory().slice(-3).flatMap(r=>(r.items||[]).map(x=>x.qid)));
 const pref=shuffle(pool.filter(q=>!recent.has(q.id))),olds=shuffle(pool.filter(q=>recent.has(q.id)));
 let items=[];
 if(['mixed','weak','syllabus','archived'].includes(setup.mode)){
    const all=[...pref,...olds];const byCh=new Map([...new Set(all.map(q=>q.chapter))].map(ch=>[ch,all.filter(q=>q.chapter===ch)]));const chs=shuffle([...byCh.keys()]);
    while(items.length<desired){let progressed=false;for(const ch of chs){let q=byCh.get(ch).shift();if(q){items.push(q);progressed=true;if(items.length>=desired)break}}if(!progressed)break}
 }else items=[...pref,...olds].slice(0,desired);
 items=shuffle(items).map(q=>({qid:q.id,chapter:q.chapter,order:shuffle(q.options.map((_,i)=>i)),selected:null,flagged:false}));
 return {items,label};
}
function begin(){if(draft()){showToast('Completa o abbandona prima la simulazione sospesa.','bad');return};const {items,label}=chooseQuestions();if(!items.length){showToast('Non ci sono ancora errori da riprovare. Completa prima una simulazione.','bad');return};const now=Date.now();db.drafts[db.active]={id:uid(),started:now,endAt:setup.timer?now+setup.timer*60e3:null,length:items.length,minutes:setup.timer,mode:setup.mode,modeLabel:label,items,index:0};db.settings={...db.settings,length:setup.length,timer:setup.timer};save();switchView('quiz')}
function startTimer(){clearInterval(timerHandle);const d=draft();if(!d?.endAt)return;const tick=()=>{const latest=draft();if(!latest)return;const remain=Math.max(0,latest.endAt-Date.now());let timer=$('#timer-live');if(timer){timer.textContent=fmtClock(remain);timer.classList.toggle('urgent',remain<60e3)}if(remain<=0){clearInterval(timerHandle);finishQuiz('Tempo scaduto')}};tick();timerHandle=setInterval(tick,1000)}
function fmtClock(ms){let s=Math.ceil(ms/1000);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function renderQuiz(){const d=draft();if(!d){view='setup';return renderSetup()};const i=d.index,item=d.items[i],q=qById[item.qid];const answered=d.items.filter(x=>x.selected!==null).length;const remaining=d.endAt?Math.max(0,d.endAt-Date.now()):null;return `${pageHeader('PROVA IN CORSO','Concentrati sulle domande','Nessuna calcolatrice richiesta: scegli la formula corretta quando il calcolo è complesso.',`<button class="btn ghost sm" data-action="abandon">Abbandona</button>`)}<div class="quiz-top"><div><strong style="font-size:13px">${h(d.modeLabel)}</strong><div class="micro">${answered} di ${d.items.length} risposte date</div></div><div id="timer-live" class="quiz-time ${remaining!==null&&remaining<60e3?'urgent':''}">${remaining!==null?fmtClock(remaining):'Senza timer'}</div></div><div class="progress" style="margin-bottom:16px"><span style="width:${pct(answered,d.items.length)}%"></span></div><div class="quizframe"><div class="qindex"><span>DOMANDA ${i+1} / ${d.items.length}</span><span>CAPITOLO ${q.chapter}</span></div><div class="qtitle">${h(q.q)}</div>${q.source?`<p class="micro" style="margin:-9px 0 16px">Fonte: ${h(q.source)}${q.adapted?" · opzioni adattate/verificate":""}</p>`:""}<div class="options">${item.order.map((real,j)=>`<label class="opt ${item.selected===real?'selected':''}"><input type="radio" name="answer" value="${real}" ${item.selected===real?'checked':''} data-answer="${real}"/><span class="letter">${'ABCD'[j]}</span><span class="opttext">${h(q.options[real])}</span></label>`).join('')}</div></div><div class="quiz-bottom"><button class="btn ghost sm" data-action="prev" ${i===0?'disabled':''}>← Precedente</button><button class="btn ghost sm" data-action="flag">${item.flagged?'★ Rimuovi segnalazione':'☆ Segna per dopo'}</button>${i===d.items.length-1?`<button class="btn primary" data-action="finish">Consegna il test ✓</button>`:`<button class="btn primary" data-action="next">Successiva →</button>`}</div><div class="card p24"><div class="section-t function finishQuiz(reason='consegna'){const d=draft();if(!d)return;const unanswered=d.items.filter(x=>x.selected===null).length;if(reason==='consegna'&&unanswered&&!confirm(`Ci sono ${unanswered} domande senza risposta. Vuoi consegnare comunque?`))return;const end=Date.now();const items=d.items.map(x=>({qid:x.qid,chapter:x.chapter,selected:x.selected,correct:x.selected!==null&&x.selected===qById[x.qid].correct,order:x.order}));const rec={id:d.id,date:new Date(end).toISOString(),started:new Date(d.started).toISOString(),mode:d.mode,modeLabel:d.modeLabel,reason,minutes:d.minutes,correct:items.filter(x=>x.correct).length,items,duration:Math.max(0,Math.round((end-d.started)/1000))};db.history[db.active]||=[];db.history[db.active].push(rec);delete db.drafts[db.active];historySelected=rec.id;save();switchView('results')}

function renderMistakes(){const all=getMistakes(),subset=all.filter(x=>!selectedMistakeCh||x.chapter===selectedMistakeCh);const worst=getChapterStats().filter(x=>x.total).sort((a,b)=>b.error-a.error);return `${pageHeader('RIPASSO MIRATO','Impara dai tuoi errori','Qui trovi le domande sbagliate almeno una volta e le relative spiegazioni. I quesiti più problematici sono mostrati per primi.',`<button class="btn primary" data-action="start-mistakes">Riprova le domande sbagliate →</button>`)}<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card metric"><div class="caption">Quesiti distinti sbagliati</div><div class="number">${all.length}</div></div><div class="card metric"><div class="caption">Errori cumulativi</div><div class="number">${getChapterStats().reduce((s,x)=>s+x.wrong,0)}</div></div><div class="card metric wide"><div class="caption">Capitolo più critico</div><div class="number">${worst.length?'Cap. '+worst[0].chapter:'—'}</div><div class="foot">${worst.length?worst[0].error+'% errori':''}</div></div></div><div class="section-title"><h2>Domande da rivedere</h2></div><div class="field" style="max-width:330px"><label for="mistake-filter">Filtra per capitolo</label><select id="mistake-filter"><option value="0">Tutti i capitoli</option>${LESSONS.map(x=>`<option value="${x.chapter}" ${selectedMistakeCh===x.chapter?'selected':''}>Cap. ${x.chapter} · ${h(x.title)}</option>`).join('')}</select></div>${subset.length?subset.map(x=>{const q=qById[x.qid];if(!q)return '';return `<article class="mistake-card"><div class="topactions"><span class="labelchip">Capitolo ${q.chapter}</span><span class="result-pill low">${x.misses} ${x.misses===1?'errore':'errori'}</span></div><div class="qtext">${h(q.q)}</div><div class="badline">Ultima risposta errata: ${x.lastAnswer===null?'Non risposta':h(q.options[x.lastAnswer])}</div><div class="goodline"><strong>Corretta:</strong> ${h(q.options[q.correct])}</div><div class="explanation">${h(q.why)}</div></article>`}).join(''):`<div class="empty-state"><div class="bigicon">✓</div>${all.length?'Nessun errore nel capitolo selezionato.':'Non hai ancora domande sbagliate salvate. Continua ad allenarti!'}</div>`}`}
function renderHistory(){const rec=profileHistory().slice().reverse();return `${pageHeader('TUTTE LE PROVE','Storico dei tentativi','Ogni simulazione rimane registrata nel browser, con punteggio, tempo impiegato e dettaglio delle risposte.',`<button class="btn ghost" data-action="export-csv">Esporta CSV</button>`)}<div class="card p24">${rec.length?renderHistoryTable(rec):`<div class="empty-state">Non hai ancora registrato simulazioni.</div>`}</div><div class="banner" style="margin-top:17px">Consiglio: usa <strong>Dati e profili → Esporta backup</strong> per conservare lo storico se cambi computer o browser.</div>`}
function renderSettings(){const profiles=db.profiles;const p=db.active;return `${pageHeader('GESTIONE DATI','Profili e salvataggi','I tuoi compagni possono usare lo stesso file: ciascuno avrà risultati personali sul proprio dispositivo.')}
 <div class="backup-grid"><div class="card p28"><div class="eyebrow">PROFILO STUDENTE</div><h2 class="card-title">Profilo attivo</h2><div class="field"><label for="profile-select">Scegli un profilo</label><select id="profile-select">${profiles.map(x=>`<option ${x===p?'selected':''} value="${h(x)}">${h(x)}</option>`).join('')}</select></div><div class="field"><label for="profile-new">Crea un altro profilo</label><input id="profile-new" maxlength="38" placeholder="Es. Martina, Luca…"></div><div class="topactions"><button class="btn primary" data-action="create-profile">＋ Crea profilo</button><button class="btn alert" data-action="delete-profile">Elimina profilo</button></div><div class="micro" style="margin-top:14px">Un profilo separa tentativi, errori e capitoli ripassati sullo stesso browser.</div></div>
 <div class="card p28"><div class="eyebrow">BACKUP E CONDIVISIONE</div><h2 class="card-title">Esporta o importa lo storico</h2><p class="small muted">Esporta un file JSON per trasferire i tuoi risultati su un altro dispositivo. L’importazione unisce i tentativi evitando duplicati.</p><div class="checklist"><button class="btn primary" data-action="export-json">↓ Esporta backup JSON</button><button class="btn ghost" data-action="import-json">↑ Importa backup JSON</button><button class="btn ghost" data-action="export-csv">↓ Scarica riepilogo CSV</button></div><div class="micro" style="margin-top:16px">I tuoi dati restano solo sul dispositivo finché non scegli di esportarli e condividerli.</div></div></div>
 <div class="section-title"><h2>Come condividere l’app con i compagni</h2></div><div class="card p24"><div class="checklist"><div class="checkline"><i>①</i><div><strong>Invia questo file HTML.</strong><br>Si apre con Chrome, Edge, Firefox o Safari senza installare programmi.</div></div><div class="checkline"><i>②</i><div><strong>Ognuno avrà il proprio storico.</strong><br>Le risposte si salvano localmente nel browser usato per aprire il file.</div></div><div class="checkline"><i>③</i><div><strong>Esporta periodicamente un backup.</strong><br>In alcuni browser, rinominare o spostare il file locale può comportare una memoria separata: il backup permette di recuperare i risultati.</div></div><div class="checkline"><i>④</i><div><strong>Per avere un unico link web</strong> basta caricare il file su un hosting statico, come GitHub Pages. Per un archivio sincronizzato fra dispositivi o una classifica di gruppo servirebbe invece un servizio online con account e database.</div></div></div></div>
 <div class="section-title"><h2>Trasparenza</h2></div><div class="card p24"><p class="small">Versione ${APP_VERSION}. Banca dati: <strong>${QUESTION_BANK.length} quiz</strong>, biblioteca: <strong>${LESSONS.reduce((s,c)=>s+c.sections.length,0)} sezioni</strong>. Tutti i quesiti appartengono ai capitoli 1–9 della dispensa. Le domande tratte dai PDF e dalle fotografie sono segnalate dalla relativa fonte. Le domande adattate correggono errori nelle opzioni originali. Il software non traccia visite, non invia richieste a server e non raccoglie dati personali fuori dal dispositivo.</p><button class="btn alert sm" data-action="reset-history">Cancella tentativi del profilo attivo</button></div>`}
function downloadFile(filename,content,mime){const blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportJSON(){const d={schema:'statlab-barbieri-v1',appVersion:APP_VERSION,exportedAt:new Date().toISOString(),profile:db.active,history:profileHistory(),read:db.read[db.active]||[]};downloadFile('statlab-backup-'+db.active.replace(/[^a-z0-9]+/gi,'_')+'.json',JSON.stringify(d,null,2),'application/json');showToast('Backup JSON esportato.')}
function exportCSV(){const rows=[['Data','Modalità','Domande','Corrette','Percentuale','Durata secondi','Capitolo','Domande capitolo','Errori capitolo','Errore capitolo %']];for(const r of profileHistory()) {const st={};for(const item of r.items||[]){const o=st[item.chapter]||(st[item.chapter]={total:0,wrong:0});o.total++;if(!item.correct)o.wrong++}for(const [ch,v] of Object.entries(st)){rows.push([r.date,r.modeLabel||r.mode,r.items.length,r.correct,pct(r.correct,r.items.length),r.duration,ch,v.total,v.wrong,pct(v.wrong,v.total)])}}const csv='\ufeff'+rows.map(x=>x.map(y=>'"'+String(y??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile('statlab-storico.csv',csv,'text/csv;charset=utf-8');showToast('Riepilogo CSV esportato.')}
function importBackup(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(String(rd.result));if(x.schema!=='statlab-barbieri-v1'||!Array.isArray(x.history))throw Error('Formato backup non valido');const incoming=x.history.filter(r=>typeof r.id==='string'&&typeof r.date==='string'&&Array.isArray(r.items)).map(r=>{
 const items=r.items.filter(it=>it&&typeof it.qid==='string'&&qById[it.qid]&&it.chapter===qById[it.qid].chapter);
 return {...r,items,correct:items.filter(it=>it.correct).length}
 }).filter(r=>r.items.length);const local=db.history[db.active]||[];const known=new Set(local.map(r=>r.id));let n=0;for(const r of incoming)if(!known.has(r.id)){local.push(r);known.add(r.id);n++}local.sort((a,b)=>new Date(a.date)-new Date(b.date));db.history[db.active]=local;db.read[db.active]=[...new Set([...(db.read[db.active]||[]),...(Array.isArray(x.read)?x.read:[])])].filter(v=>Number.isInteger(v)&&v>=1&&v<=9);save();showToast(`Importazione completata: ${n} tentativi aggiunti.`);switchView('dashboard')}catch(e){showToast('Impossibile importare: '+e.message,true)}finally{$('#import-file').value=''}};rd.readAsText(file,'UTF-8')}
function handleAction(el){const act=el.dataset.action;if(!act)return;const d=draft();const n=Number(el.dataset.ch);
 if(act==='menu')$('#sidebar').classList.toggle('mobile-open');
 else if(act==='quick-start'){if(d){switchView('quiz')}else switchView('setup')}
 else if(act==='chapter-test'){setup.mode='chapter';setup.chapter=n;setup.length=10;switchView('setup')}
 else if(act==='start-mistakes'){setup.mode='mistakes';setup.length=10;switchView('setup')}
 else if(act==='archive-more'){archiveFilters.limit+=25;render()}
 else if(act==='begin')begin();
 else if(act==='resume')switchView('quiz');
 else if(act==='abandon'){if(!d)return;if(confirm('Abbandonare la simulazione senza registrare il risultato?')){delete db.drafts[db.active];save();switchView('setup')}}
 else if(act==='prev'&&d){d.index=clamp(d.index-1,0,d.items.length-1);save();render()}
 else if(act==='next'&&d){d.index=clamp(d.index+1,0,d.items.length-1);save();render()}
 else if(act==='go-question'&&d){d.index=clamp(Number(el.dataset.index),0,d.items.length-1);save();render()}
 else if(act==='flag'&&d){d.items[d.index].flagged=!d.items[d.index].flagged;save();render()}
 else if(act==='finish')finishQuiz();
 else if(act==='view-record'){historySelected=el.dataset.id;switchView('results')}
 else if(act==='select-lesson'){theorySelected=n;currentFilters.search='';switchView('theory')}
 else if(act==='select-formula'){formulaSelected=n;formulaQuery='';switchView('formulario')}
 else if(act==='print-formulas'){window.print()}
 else if(act==='mark-read'){let a=db.read[db.active]||[];db.read[db.active]=a.includes(n)?a.filter(x=>x!==n):[...a,n];save();render()}
 else if(act==='export-json')exportJSON();else if(act==='export-csv')exportCSV();else if(act==='import-json')$('#import-file').click();
 else if(act==='create-profile'){const inp=$('#profile-new');const name=inp?.value.trim().replace(/\s+/g,' ');if(!name||name.length<2){showToast('Inserisci un nome di almeno 2 caratteri.','bad');return}if(db.profiles.some(x=>x.toLowerCase()===name.toLowerCase())){showToast('Profilo già esistente.','bad');return}db.profiles.push(name);db.history[name]=[];db.read[name]=[];db.active=name;save();showToast('Profilo creato.');switchView('dashboard')}
 else if(act==='delete-profile'){if(db.profiles.length===1){showToast('Deve restare almeno un profilo.','bad');return}if(confirm(`Eliminare il profilo «${db.active}» e tutti i suoi tentativi?`)){const old=db.active;db.profiles=db.profiles.filter(x=>x!==old);delete db.history[old];delete db.read[old];delete db.drafts[old];db.active=db.profiles[0];save();switchView('dashboard')}}
 else if(act==='reset-history'){if(confirm('Cancellare definitivamente tutte le prove del profilo attivo? Ti consigliamo prima un backup.')){db.history[db.active]=[];save();switchView('dashboard')}}
}
$('#app').addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-nav]');if(!el)return;if(el.dataset.action)handleAction(el);else if(el.dataset.nav)switchView(el.dataset.nav)});
$('#sidebar-nav').addEventListener('click',e=>{const el=e.target.closest('[data-nav]');if(el)switchView(el.dataset.nav)});
$('.topbar').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handleAction(el)});
$('#app').addEventListener('change',e=>{const t=e.target;if(t.matches('[data-answer]')){const d=draft();if(d){d.items[d.index].selected=Number(t.value);save();render()}}
 else if(t.id==='mode'){setup.mode=t.value;render()}
 else if(t.id==='length'){setup.length=Number(t.value)}
 else if(t.id==='timer'){setup.timer=Number(t.value)}
 else if(t.id==='chapter-select'){setup.chapter=Number(t.value)}
 else if(t.id==='mistake-filter'){selectedMistakeCh=Number(t.value);render()}
 else if(t.id==='archive-source'){archiveFilters.source=t.value;archiveFilters.limit=25;render()}
 else if(t.id==='archive-chapter'){archiveFilters.chapter=Number(t.value);archiveFilters.limit=25;render()}
 else if(t.id==='profile-select'){const name=t.value;if(db.profiles.includes(name)){db.active=name;save();switchView('dashboard')}}
});
$('#app').addEventListener('input',e=>{const t=e.target;if(t.id==='formula-search'){const val=t.value;formulaQuery=val;let pos=t.selectionStart;render();const n=$('#formula-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}else if(t.id==='theory-search'){const val=t.value;currentFilters.search=val;let pos=t.selectionStart;render();const n=$('#theory-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}else if(t.id==='archive-search'){archiveFilters.query=t.value;archiveFilters.limit=25;let pos=t.selectionStart;render();const n=$('#archive-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
$('#import-file').addEventListener('change',e=>importBackup(e.target.files?.[0]));
document.addEventListener('keydown',e=>{if(view!=='quiz'||!draft())return;if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const d=draft();if(/^\d$/.test(e.key)){let pos=Number(e.key)-1;let item=d.items[d.index];if(pos>=0&&pos<item.order.length){item.selected=item.order[pos];save();render()}}else if(e.key==='ArrowRight'){d.index=clamp(d.index+1,0,d.items.length-1);save();render()}else if(e.key==='ArrowLeft'){d.index=clamp(d.index-1,0,d.items.length-1);save();render()}});
render();

</script>
</body></html>
