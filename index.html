pporto risultante meno 1.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-095","chapter":6,"q":"Il valore del PIL include una stima dell’economia non osservata?","options":["No, il sommerso è escluso","Sì, comprende il sommerso economico e alcune attività illegali","No, comprende solo l’economia informale","Sì, ma esclusivamente il sommerso economico"],"correct":1,"why":"Per essere esaustive le stime del PIL comprendono anche componenti dell’economia non osservata secondo le regole dei conti nazionali.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-096","chapter":7,"q":"Una popolazione comprende 60.000 persone, delle quali 25.000 forze di lavoro, 22.500 occupati e 2.500 disoccupati. Quale rapporto esprime il tasso di disoccupazione?","options":["2.500/25.000","2.500/42.000","2.500/60.000","Non è calcolabile"],"correct":0,"why":"Il denominatore del tasso di disoccupazione sono le forze di lavoro (occupati + disoccupati).","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-097","chapter":7,"q":"Una regione ha 60.000 residenti, 30.000 forze di lavoro e 40.000 individui tra 15 e 64 anni. Quale formula fornisce il tasso di inattività dei 15–64enni, supponendo che le 30.000 forze di lavoro siano tutte nella stessa fascia?","options":["(40.000−30.000)/40.000","(60.000−30.000)/60.000","3.000/30.000","Non è definibile"],"correct":0,"why":"Con popolazione e forze di lavoro riferite alla stessa classe d’età, inattivi = popolazione − forze di lavoro.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-098","chapter":7,"q":"Le forze di lavoro sono 25.100, gli occupati 22.800 e la popolazione 15–64 anni è 37.954. Quale rapporto imposta il tasso di occupazione 15–64 anni, assumendo gli occupati riferiti alla stessa fascia?","options":["22.800/25.100","22.800/37.954","22.800/59.258"],"correct":1,"why":"Il tasso di occupazione è occupati della fascia / popolazione della stessa fascia. La coerenza fra numeratore e denominatore è essenziale.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-103","chapter":7,"q":"Per una stima pari a 8,85% l’errore relativo è 0,02. Quale interpretazione è corretta?","options":["La stima differisce certamente dal vero valore di 0,02 punti","L’errore standard è pari al 2% della stima","La probabilità che la stima sia sbagliata è 2%"],"correct":1,"why":"L’errore relativo o coefficiente di variazione è SE/stima; 0,02 significa 2% della stima.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-105","chapter":8,"q":"Il rapporto S80/S20 è 6,5 in Spagna e 5,2 in Italia. In quale Paese la distribuzione del reddito è più disuguale secondo questo indicatore?","options":["Italia","Spagna","Non è confrontabile perché le popolazioni sono differenti"],"correct":1,"why":"Un valore S80/S20 più elevato segnala un rapporto maggiore fra reddito del quinto più ricco e del quinto più povero.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-106","chapter":8,"q":"Il rapporto S80/S20 è 3,9 nel Nord-Est e 4,5 nel Nord-Ovest. Dove è più concentrato il reddito secondo S80/S20?","options":["Nord-Ovest","Non abbiamo informazioni sufficienti","Nord-Est"],"correct":0,"why":"Il rapporto maggiore 4,5 segnala una disuguaglianza più marcata tra il quinto ricco e quello povero.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-107","chapter":8,"q":"Il rapporto S80/S20 è 5,7 nel Mezzogiorno e 4,8 nel Centro. Secondo l’indicatore, quale area è più disuguale?","options":["Centro","Mezzogiorno","Non si può concludere perché il rapporto non è normalizzato"],"correct":1,"why":"Il valore 5,7 è maggiore di 4,8: il quinto più ricco detiene un multiplo relativamente più grande del reddito del quinto più povero.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-108","chapter":8,"q":"La composizione percentuale del reddito nei quinti è: senza affitti figurativi 6,7; 12,9; 17,7; 23,4; 39,3. Con affitti figurativi 7,4; 13,4; 18,1; 23,3; 37,8. Quale distribuzione è meno disuguale?","options":["Non abbiamo informazioni sufficienti","Quella inclusiva degli affitti figurativi","Quella esclusiva degli affitti figurativi"],"correct":1,"why":"Le quote cumulate dei quinti più poveri risultano sistematicamente maggiori con affitti figurativi: la curva di Lorenz è più vicina alla diagonale.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-109","chapter":8,"q":"Le quote di spesa nei cinque quinti nel 2017 sono 7,6; 12,5; 16,9; 23,0; 39,9%. Nel 2019 sono 7,9; 12,8; 17,1; 22,9; 39,4%. Quale distribuzione è meno disuguale?","options":["2017","2019","Non abbiamo informazioni sufficienti"],"correct":1,"why":"Nel 2019 la quota cumulata dei quinti più poveri è sistematicamente maggiore; la curva di Lorenz domina quella del 2017 (piccoli scarti sono dovuti agli arrotondamenti).","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-110","chapter":8,"q":"Un’impresa possiede cinque clienti che generano rispettivamente il 5%, 10%, 15%, 20% e 50% del fatturato. Che cosa indica la ripartizione?","options":["Il fatturato è perfettamente equidistribuito","Il fatturato è concentrato: un cliente pesa per metà","Non è possibile analizzare la concentrazione del fatturato"],"correct":1,"why":"L’ultimo cliente produce metà del fatturato e la distribuzione è quindi lontana dall’equidistribuzione.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-114","chapter":7,"q":"A parità di errore standard, se il livello di confidenza di un intervallo passa dal 90% al 95%, la sua ampiezza:","options":["Diminuisce","Aumenta","Resta identica"],"correct":1,"why":"Un livello di confidenza maggiore implica un quantile critico più alto e quindi margini più ampi.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 5","sourceType":"archived","adapted":false},{"id":"arc-116","chapter":3,"q":"Ad agosto 2021 i prezzi risultano stabili da settembre a dicembre. Se l’inflazione acquisita ad agosto è +1,6%, quanto sarà l’inflazione annua media?","options":["+0,5%","+1,9%","+1,6%"],"correct":2,"why":"La definizione di acquisita assume già che l’indice dell’ultimo mese resti costante fino a dicembre.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 8","sourceType":"archived","adapted":false},{"id":"arc-117","chapter":7,"q":"Se una stima campionaria ha errore standard maggiore di un’altra nella stessa unità di misura, che cosa significa necessariamente?","options":["La prima stima è meno precisa in termini assoluti","La prima stima ha certamente un errore di misura sistematico","La prima stima è sicuramente più distorta"],"correct":0,"why":"L’errore standard misura dispersione campionaria dello stimatore e non è di per sé indicatore di distorsione sistematica.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 10","sourceType":"archived","adapted":false},{"id":"arc-118","chapter":3,"q":"Due città hanno lo stesso numero indice dei prezzi pari a 120, ma rispetto a livelli base differenti. Possiamo concludere che il bene abbia lo stesso prezzo in entrambe?","options":["Sì, perché 120=120","No, i livelli assoluti del prezzo base potrebbero essere diversi","Sì, ma soltanto se la variazione è tendenziale"],"correct":1,"why":"Lo stesso aumento percentuale rispetto a prezzi base diversi non determina lo stesso prezzo corrente.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 21","sourceType":"archived","adapted":true},{"id":"arc-119","chapter":2,"q":"Una variazione relativa del prezzo è espressa in percentuale. Quale caratteristica ha la sua unità di misura?","options":["È euro","È adimensionale","È euro al mese"],"correct":1,"why":"Un rapporto tra prezzi omogenei non mantiene l’unità di misura monetaria.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 11","sourceType":"archived","adapted":true},{"id":"arc-120","chapter":3,"q":"Nel prospetto NIC 2018 l’inflazione ereditata dal 2017 è +0,1%. Se nel 2018 non ci fossero state variazioni congiunturali dei prezzi, quale inflazione media annua si sarebbe osservata?","options":["+0,1%","0%","+1,1%"],"correct":0,"why":"Senza movimenti nel corso del 2018, il livello di dicembre 2017 resterebbe costante: la variazione media 2018 sarebbe l’inflazione ereditata +0,1%.","source":"QUIZ STATISTICA.pdf · p. 7","sourceType":"archived","adapted":false},{"id":"arc-121","chapter":3,"q":"Nel prospetto NIC 2019 l’inflazione ereditata dal 2018 è 0,0%. In assenza di qualsiasi variazione dei prezzi nei mesi del 2019, il tasso medio annuo del 2019 sarebbe:","options":["0%","+0,6%","−0,1%"],"correct":0,"why":"L’inflazione ereditata misura il trascinamento dell’anno precedente nell’ipotesi di prezzi invariati.","source":"QUIZ STATISTICA.pdf · p. 7","sourceType":"archived","adapted":false},{"id":"arc-122","chapter":3,"q":"Nel prospetto NIC 2019 il trascinamento al 2020 è −0,1%. Se nel 2020 non si fossero verificate variazioni congiunturali, il tasso medio annuo del 2020 sarebbe:","options":["−0,1%","0%","+0,6%"],"correct":0,"why":"Con prezzi fermi, l’inflazione media annuale corrisponde al trascinamento ereditato dalla fine dell’anno precedente.","source":"QUIZ STATISTICA.pdf · p. 8","sourceType":"archived","adapted":false},{"id":"arc-123","chapter":3,"q":"Il NIC vale 103,5 ad agosto 2019 e 103,0 ad agosto 2020 (stessa base). Quale espressione calcola l’inflazione tendenziale di agosto 2020?","options":["(103,0/103,5 − 1) × 100","(103,5/103,0 − 1) × 100","103,0 − 103,5"],"correct":0,"why":"La variazione tendenziale confronta lo stesso mese di anni consecutivi: indice 2020 / indice 2019 −1.","source":"QUIZ STATISTICA.pdf · p. 8","sourceType":"archived","adapted":false},{"id":"arc-124","chapter":9,"q":"La spesa familiare mensile nel 2017 è 2.564 €; il NIC vale 99,9 nel 2016 e 101,1 nel 2017. Quale formula valuta la spesa 2017 ai prezzi del 2016?","options":["2.564 × (99,9/101,1)","2.564 × (101,1/99,9)","2.564 − (1,2/100)"],"correct":0,"why":"Per deflazionare 2017 in prezzi 2016 si usa il rapporto indice del 2016/indice del 2017.","source":"QUIZ STATISTICA.pdf · p. 10","sourceType":"archived","adapted":true},{"id":"arc-125","chapter":9,"q":"Nel 2016 la spesa media familiare è 2.424 € e nel 2017 è 2.564 €; gli indici NIC sono 99,9 e 101,1. Quale espressione fornisce la variazione REALE nel 2017?","options":["[(2.564/2.424)×(99,9/101,1) − 1] × 100","(2.564/2.424 − 1) × 100","[(2.564/2.424)×(101,1/99,9) − 1] × 100"],"correct":0,"why":"Il rapporto nominale della spesa va corretto dividendo per il rapporto dei prezzi: 101,1/99,9.","source":"QUIZ STATISTICA.pdf · p. 11","sourceType":"archived","adapted":true},{"id":"arc-126","chapter":9,"q":"Nel 2016 la spesa media familiare era 2.424 € e nel 2017 2.564 €. Quale formula dà la variazione NOMINALE della spesa nel 2017?","options":["(2.564/2.424 − 1) × 100","(2.424/2.564 − 1) × 100","(2.564/2.424) × 100"],"correct":0,"why":"Per la variazione nominale basta confrontare i valori monetari finali e iniziali.","source":"QUIZ STATISTICA.pdf · p. 11","sourceType":"archived","adapted":true},{"id":"arc-127","chapter":5,"q":"L’indice della produzione industriale destagionalizzato ad agosto 2022 vale 107,2 con base 2015=100; quello corretto solo per calendario vale 72,0. Per confrontare la produzione col 2015, quale variazione si usa?","options":["+7,2%","−28,0%","−27,0%"],"correct":0,"why":"Per un raffronto depurato dagli effetti ricorrenti si usa il dato destagionalizzato, 107,2: è il 7,2% sopra la base 100.","source":"QUIZ STATISTICA.pdf · p. 10","sourceType":"archived","adapted":true},{"id":"arc-128","chapter":6,"q":"Il PIL concatenato vale 1.720.515 nel 2018 e 1.727.574 nel 2019 (milioni di euro). Quale formula misura la crescita del PIL in volume nel 2019?","options":["(1.727.574/1.720.515 − 1) × 100","(1.794.935/1.771.391 − 1) × 100","(102,9/102,3 − 1) × 100"],"correct":0,"why":"La crescita in volume del PIL è la variazione percentuale della serie a valori concatenati.","source":"QUIZ STATISTICA.pdf · p. 9","sourceType":"archived","adapted":true},{"id":"arc-129","chapter":6,"q":"Il PIL concatenato vale 1.727.574 nel 2019 e 1.573.153 nel 2020. Quale espressione fornisce la variazione REALE del PIL nel 2020?","options":["(1.573.153/1.727.574 − 1) × 100","(1.653.577/1.794.935 − 1) × 100","(102,7/102,9 − 1) × 100"],"correct":0,"why":"Per il volume si confrontano gli aggregati concatenati; i valori correnti misurano la variazione nominale.","source":"QUIZ STATISTICA.pdf · p. 14","sourceType":"archived","adapted":true},{"id":"arc-130","chapter":6,"q":"Il PIL concatenato vale 1.572.543 nel 2020 e 1.678.490 nel 2021. Quale formula misura la variazione di quantità del PIL nel 2021?","options":["(1.678.490/1.572.543 − 1) × 100","(1.782.050/1.660.621 − 1) × 100","(104,7/102,7 − 1) × 100"],"correct":0,"why":"La variazione reale usa il PIL a valori concatenati dei due anni consecutivi.","source":"QUIZ STATISTICA.pdf · p. 14","sourceType":"archived","adapted":true},{"id":"arc-131","chapter":9,"q":"Nel 2018 la spesa media familiare era 2.571 € e nel 2019 2.560 €; il NIC valeva rispettivamente 102,3 e 102,9. Quale formula valuta la spesa 2019 ai PREZZI 2018?","options":["2.560 × (102,3/102,9)","2.560 × (102,9/102,3)","2.560 × (100/102,3)"],"correct":0,"why":"Per riportare il valore 2019 ai prezzi 2018 si moltiplica per NIC2018/NIC2019.","source":"QUIZ STATISTICA.pdf · p. 13","sourceType":"archived","adapted":true},{"id":"arc-132","chapter":9,"q":"Nel 2018 la spesa media familiare era 2.571 € (NIC 102,3), nel 2019 2.560 € (NIC 102,9). Quale formula dà la variazione REALE della spesa nel 2019?","options":["[(2.560/2.571)×(102,3/102,9)−1] × 100","(2.560/2.571−1) × 100","[(2.560/2.571)×(102,9/102,3)−1] × 100"],"correct":0,"why":"La crescita reale è il rapporto dei valori monetari corretto per il tasso dei prezzi.","source":"QUIZ STATISTICA.pdf · p. 12","sourceType":"archived","adapted":true},{"id":"arc-133","chapter":9,"q":"Nel 2017 la spesa media familiare era 2.564 € (NIC 101,1); nel 2018 era 2.571 € (NIC 102,3). Quale formula valuta la spesa del 2018 ai PREZZI del 2017?","options":["2.571 × (101,1/102,3)","2.571 × (102,3/101,1)","2.571 − (1,2/100)"],"correct":0,"why":"La deflazione usa NIC dell’anno di riferimento diviso NIC dell’anno del valore nominale.","source":"QUIZ STATISTICA.pdf · p. 13","sourceType":"archived","adapted":true},{"id":"arc-134","chapter":9,"q":"Nel 2021 la spesa media familiare è 2.437 €, con NIC 104,7; nel 2020 il NIC era 102,7. Come si esprime la spesa del 2021 in prezzi del 2020?","options":["2.437 × (102,7/104,7)","2.437 × (104,7/102,7)","2.437 − (1,9/100)"],"correct":0,"why":"Per riportare il valore del 2021 ai prezzi 2020 occorre moltiplicare per l’indice 2020 diviso l’indice 2021.","source":"QUIZ STATISTICA.pdf · p. 17","sourceType":"archived","adapted":true},{"id":"arc-135","chapter":9,"q":"La spesa media pro capite passa da 1.002 € nel 2020 a 1.049 € nel 2021. Quale formula calcola la variazione NOMINALE percentuale nel 2021?","options":["(1.049/1.002 − 1) × 100","(1.002/1.049 − 1) × 100","(1.049/1.002) × 100"],"correct":0,"why":"Il tasso di crescita nominale usa il rapporto tra i due valori monetari.","source":"QUIZ STATISTICA.pdf · p. 16","sourceType":"archived","adapted":true},{"id":"arc-136","chapter":9,"q":"La spesa media per famiglia passa da 2.328 € nel 2020 a 2.437 € nel 2021. Quale espressione dà la variazione NOMINALE percentuale?","options":["(2.437/2.328 − 1) × 100","(2.328/2.437 − 1) × 100","(2.437/2.328) × 100"],"correct":0,"why":"Variazione percentuale annuale = (valore corrente/valore precedente−1)×100.","source":"QUIZ STATISTICA.pdf · p. 17","sourceType":"archived","adapted":true}];
const LESSONS=[{"chapter":1,"title":"Indagini statistiche","pages":"4–13","summary":"Come nasce un dato ufficiale: popolazioni, campioni, interviste e qualità.","sections":[{"chapter":1,"title":"Unità statistiche, popolazione, caratteri e modalità","content":"Un’indagine statistica raccoglie informazioni per descrivere quantitativamente un fenomeno collettivo. Prima di raccogliere dati bisogna delimitare il fenomeno, il territorio, il periodo e la popolazione di riferimento. L’unità statistica è l’elemento osservato; la popolazione è l’insieme delle unità; il carattere (o variabile) è la proprietà rilevata; le modalità sono i possibili valori o categorie.\nEsempi: nello studio del reddito delle famiglie la famiglia è unità statistica, il reddito è il carattere quantitativo; nella rilevazione delle professioni la professione è un carattere qualitativo.","formulas":[],"example":"Indagine su 250 imprese: unità = singola impresa; popolazione = insieme delle imprese che si intendono studiare; variabile = fatturato annuo.","pitfall":"Non confondere la variabile osservata (fatturato) con l’unità su cui viene misurata (impresa)."},{"chapter":1,"title":"Progettazione: obiettivi, disegno e tempi","content":"La progettazione definisce che cosa conoscere, su chi misurarlo, quali variabili rilevare e come comunicarne i risultati. Un’indagine può essere totale/censuaria o campionaria; diretta (intervista o osservazione) o indiretta (riuso di archivi amministrativi); trasversale (un periodo) o longitudinale (le stesse unità nel tempo).\nI costi, i tempi, la copertura e la qualità interagiscono: una rilevazione veloce ma incompleta può essere poco affidabile, come una rilevazione accurata pubblicata troppo tardi.","formulas":[],"example":"","pitfall":"Un censimento cerca di includere tutte le unità ma può avere comunque mancate risposte e altri errori."},{"chapter":1,"title":"Tecniche d’indagine e raccolta delle risposte","content":"Intervista faccia a faccia: consente chiarimenti, ma è più costosa e può influenzare le risposte. Intervista telefonica: più rapida, talvolta con limiti di copertura. Questionario autocompilato via posta o web: economico, ma espone a mancate risposte. Diario: adatto alle spese frequenti di piccola entità. Le modalità miste combinano tecniche.\nPAPI = Pencil And Paper Interview; CAPI = intervista personale assistita da computer; CATI = telefonica assistita da computer; CAWI = questionario web.","formulas":[],"example":"","pitfall":"CAPI è un’intervista personale; CATI è telefonica; CAWI usa il web."},{"chapter":1,"title":"Campionamento probabilistico e non probabilistico","content":"Nel campionamento probabilistico l’inclusione avviene con un meccanismo casuale noto, così si possono costruire stime e valutarne l’errore campionario. Nel non probabilistico (volontari, convenienza, quote non casuali, palla di neve) alcune unità possono risultare sovra- o sottorappresentate senza che si possano correggere facilmente le distorsioni.\nIl campionamento casuale semplice estrae unità da una lista completa; quello sistematico sceglie una partenza casuale e poi un’unità ogni k posizioni. Lo stratificato divide la popolazione in gruppi omogenei e sorteggia all’interno degli strati; il campionamento a più stadi estrae prima unità primarie (comuni) e poi secondarie (famiglie).","formulas":["Passo sistematico: k = N/n"],"example":"N=600, n=50, partenza=7: k=12; le prime posizioni sono 7, 19, 31.","pitfall":"“Stratificato” non è sinonimo di “due stadi”: nel primo si campiona all’interno di ogni strato; nel secondo si selezionano unità gerarchiche in fasi."},{"chapter":1,"title":"Censimento, inferenza e precisione","content":"Un campione consente di contenere il costo e spesso migliorare il controllo delle interviste, ma introduce variabilità campionaria: campioni casuali diversi possono fornire risultati diversi. L’inferenza statistica permette di estendere le osservazioni all’intera popolazione e di misurare l’incertezza delle stime. Per questo è fondamentale che la selezione sia coerente con il disegno e che la lista di base sia aggiornata.","formulas":[],"example":"","pitfall":"Un campione grande ma selezionato in modo distorto non garantisce una buona stima."},{"chapter":1,"title":"Errori non campionari e controllo di qualità","content":"Errori di copertura, risposta, registrazione ed elaborazione possono verificarsi anche nei censimenti. La mancata risposta può essere totale (unità non intervistata) o parziale (alcune domande mancanti). Per le risposte mancanti si possono applicare tecniche di imputazione; la prevenzione prevede formazione, questionari chiari, ricontatto, controlli di coerenza e validazione dei dati.\nSe le famiglie ad alto reddito rispondono meno delle altre, il campione effettivamente osservato può risultare selettivo, causando distorsione.","formulas":[],"example":"","pitfall":"L’imputazione di una domanda mancante è diversa dalla sostituzione di un’intera famiglia che non risponde."}]},{"chapter":2,"title":"Rapporti, indici e variazioni","pages":"14–29","summary":"Confrontare fenomeni economici in modo corretto, con basi, pesi e concatenamenti.","sections":[{"chapter":2,"title":"Rapporti statistici: composizione, coesistenza e derivazione","content":"Un rapporto permette confronti standardizzati. Il rapporto di composizione confronta una parte col totale: per esempio disoccupati/forze di lavoro. Il rapporto di coesistenza confronta due categorie distinte, ad esempio maschi/femmine. Un rapporto di derivazione confronta grandezze collegate da un fenomeno causale o economico, come nati/popolazione. I rapporti possono essere riportati per 1, per 100 o per 1000 unità.","formulas":["Composizione = parte/totale × 100","Coesistenza = quantità A/quantità B × 100","Tasso di disoccupazione = disoccupati/forze di lavoro × 100"],"example":"180 maschi e 150 femmine: rapporto di mascolinità per 100 femmine = (180/150)×100 = 120.","pitfall":"La somma delle due categorie compare nel denominatore di una composizione, non di un rapporto di coesistenza."},{"chapter":2,"title":"Numeri indice semplici a base fissa e mobile","content":"I numeri indice confrontano il valore di una variabile tra due tempi. Una base fissa usa sempre lo stesso periodo di riferimento; la base mobile confronta ogni periodo con quello immediatamente precedente. Con base 100, un indice 115 significa crescita del 15% rispetto alla base. Gli indici sono numeri puri e dipendono dalla scelta del periodo base nel loro livello, non nel significato del confronto.","formulas":["Indice semplice a base fissa: I₀,ₜ = (xₜ/x₀)×100","Indice a base mobile: Iₜ₋₁,ₜ = (xₜ/xₜ₋₁)×100"],"example":"x₍₂₀₂₀₎=50, x₍₂₀₂₁₎=60, x₍₂₀₂₂₎=54: indice 2022/2020=108; indice 2022/2021=90.","pitfall":"Un indice 108 non indica “108% di inflazione”: indica 8% di aumento dalla base."},{"chapter":2,"title":"Variazioni relative e percentuali","content":"La variazione assoluta è xₜ−x₀. La variazione relativa rapporta la differenza al valore iniziale; moltiplicata per 100 dà il tasso percentuale. I tassi successivi si compongono in modo moltiplicativo: un +10% seguito da −10% non riporta al valore iniziale.","formulas":["Variazione % = [(xₜ/x₀)−1]×100","Fattore complessivo = (1+r₁)(1+r₂)…"],"example":"100→110→99: +10% seguito da −10% dà 99, cioè −1% rispetto all’inizio.","pitfall":"La differenza fra punti di indice non è di per sé una variazione percentuale."},{"chapter":2,"title":"Indici complessi di valore, prezzo e quantità","content":"Quando si confrontano più beni serve aggregare prezzi e quantità. L’indice di valore confronta il valore totale ∑pₜqₜ con ∑p₀q₀: può cambiare sia per effetto dei prezzi sia delle quantità. Gli indici di prezzo mantengono fisse quantità base (Laspeyres) o correnti (Paasche). Gli indici di quantità mantengono fissi prezzi base (Laspeyres) o correnti (Paasche). Fisher è la media geometrica di Laspeyres e Paasche.","formulas":["Valore V = ∑(pₜqₜ)/∑(p₀q₀)","Laspeyres prezzi Lₚ = ∑(pₜq₀)/∑(p₀q₀)","Paasche prezzi Pₚ = ∑(pₜqₜ)/∑(p₀qₜ)","Laspeyres quantità Lᵩ = ∑(p₀qₜ)/∑(p₀q₀)","Paasche quantità Pᵩ = ∑(pₜqₜ)/∑(pₜq₀)","Fisher prezzi Fₚ = √(Lₚ·Pₚ)"],"example":"","pitfall":"Il “segreto” degli esercizi è leggere quale lettera resta fissa nel numeratore e denominatore: p o q, base 0 o corrente t."},{"chapter":2,"title":"Concatenamento degli indici e cambio di base","content":"Gli indici a catena confrontano intervalli vicini e poi vengono moltiplicati per ottenere un indice di lungo periodo. Il procedimento è utile quando nel tempo cambiano beni rappresentativi e pesi. Il cambio di base di un indice esistente si effettua rapportando tutti i valori al numero indice dell’anno scelto come nuova base.","formulas":["I₀,ₜᴄ = I₀,ₜ₋₁ᴄ × Iₜ₋₁,ₜ (indici relativi)","Indice con nuova base b=100: Iᵇₜ = (I⁰ₜ/I⁰ᵦ)×100"],"example":"Due anelli 1,10 e 0,90: concatenato in base 100 =1,10×0,90×100 = 99.","pitfall":"Quando gli indici sono già espressi in base 100, bisogna convertirli in forma relativa prima di moltiplicarli."},{"chapter":2,"title":"Scomposizione del valore","content":"In determinate scomposizioni, l’indice di valore può essere ottenuto come prodotto di un indice di prezzo e di uno di quantità compatibili. Se conosciamo l’aumento nominale e l’aumento reale, la variazione dei prezzi si ricava mediante un rapporto, non dalla semplice differenza dei tassi (che è solo un’approssimazione).","formulas":["Indice prezzi implicito = Indice valore / Indice volume","Inflazione implicita % = [(Iᵛ/Iᵠ)−1]×100"],"example":"Se il valore cresce del 10% e il volume del 5%, la componente dei prezzi è (1,10/1,05−1)×100, non esattamente 5%.","pitfall":"Valore, prezzo e quantità hanno numeratori e denominatori diversi; non confondere i loro indici."}]},{"chapter":3,"title":"Indici dei prezzi al consumo","pages":"30–45","summary":"NIC, FOI, IPCA, inflazione, indicizzazione e deflazione.","sections":[{"chapter":3,"title":"NIC, FOI, IPCA: cosa misurano","content":"L’Istat pubblica tre principali indici dei prezzi al consumo. NIC: intera collettività nazionale, usato per l’inflazione italiana (con tabacchi). FOI: famiglie di operai e impiegati; il FOI senza tabacchi viene usato per rivalutazioni monetarie. IPCA: indice armonizzato, con metodologia pensata per confronti della dinamica dei prezzi tra paesi dell’Unione europea. Differiscono per popolazione economica di riferimento, trattamento di alcune transazioni e copertura.\nL’IPCA include particolari promozioni/saldi secondo la metodologia armonizzata e contempla anche la variante a tassazione costante (IPCA-TC).","formulas":[],"example":"","pitfall":"I valori degli indici IPCA di due paesi NON sono un confronto diretto dei livelli assoluti dei prezzi tra i paesi."},{"chapter":3,"title":"Paniere, raccolta prezzi e ponderazioni","content":"Il paniere rappresenta beni e servizi acquistati dalle famiglie, suddivisi per gruppi omogenei. Prezzi sono rilevati con differenti modalità e fonti, inclusi dati di cassa per alcuni beni; i prezzi elementari vengono aggregati mediante sistemi di ponderazione che riflettono l’importanza relativa delle spese. L’aggiornamento del paniere e dei pesi serve a seguire il cambiamento delle abitudini di consumo. L’indice misura dinamiche medie, non l’aumento di prezzo vissuto da ciascuna famiglia.","formulas":[],"example":"","pitfall":"L’aumento di prezzo di un singolo prodotto non è automaticamente il tasso di inflazione del paniere."},{"chapter":3,"title":"Inflazione congiunturale, tendenziale e media annua","content":"L’inflazione è una variazione percentuale di un numero indice dei prezzi. La congiunturale confronta un mese col precedente; la tendenziale confronta un mese con lo stesso dell’anno prima; la media annua confronta l’indice medio dei 12 mesi con la media dell’anno precedente. Un’inflazione positiva che scende da 5% a 3% significa che i prezzi aumentano più lentamente, non che diminuiscono.","formulas":["Congiunturale % = [(Iₘ/Iₘ₋₁)−1]×100","Tendenziale % = [(Iₘ,ₜ/Iₘ,ₜ₋₁)−1]×100","Media annua % = [(media I anno t/media I anno t−1)−1]×100"],"example":"Indice aprile=104, maggio=105: congiunturale maggio=(105/104−1)×100.","pitfall":"La stessa base temporale degli indici è necessaria per calcolare correttamente i rapporti."},{"chapter":3,"title":"Inflazione acquisita, ereditata, propria e trasmessa","content":"L’inflazione acquisita di un anno usa i dati mensili già disponibili e ipotizza che fino a dicembre il livello resti uguale all’ultimo mese osservato. L’inflazione ereditata confronta il livello di dicembre precedente con l’indice medio del precedente anno; rappresenta l’effetto della dinamica pregressa. L’inflazione propria confronta la media dell’anno corrente con dicembre dell’anno precedente. Le diverse componenti permettono una scomposizione della variazione media annua; l’effetto di dicembre corrente sul periodo successivo è l’inflazione trasmessa.","formulas":["Acquisita = [(media annua simulata/m. annua precedente)−1]×100","Ereditata anno t = [(I dic(t−1)/media I(t−1))−1]×100","Propria anno t = [(media I(t)/I dic(t−1))−1]×100"],"example":"Media 2024=100, dicembre 2024=104, media 2025=108: ereditata 2025=(104/100−1)×100; propria 2025=(108/104−1)×100.","pitfall":"Nell’acquisita, anche il mese corrente va contato insieme ai mesi successivi che si ipotizzano uguali."},{"chapter":3,"title":"Inflazione di fondo (core inflation)","content":"La misura di fondo viene calcolata escludendo i beni energetici e gli alimentari non lavorati dal NIC, per attenuare l’influenza delle componenti volatili. Se l’inflazione generale è maggiore della core inflation, in quel confronto le componenti volatili hanno sostenuto il tasso generale; se è minore, lo hanno contenuto. La differenza tra i due tassi non è però il tasso di aumento di un singolo gruppo di prodotti.","formulas":[],"example":"NIC +2,4%, core +1,6%: le componenti escluse hanno avuto complessivamente un effetto di sostegno.","pitfall":"Core inflation non è “inflazione dei prodotti più importanti” ma inflazione senza energetici e alimentari non lavorati."},{"chapter":3,"title":"Indicizzazione monetaria e deflazione","content":"La rivalutazione (indicizzazione) adegua un importo monetario al cambiamento di un indice, come il FOI senza tabacchi per alcuni contratti di locazione. La deflazione ricava una misura reale dividendo la grandezza nominale per un indice dei prezzi correttamente espresso. Un aumento nominale pari a quello dei prezzi non implica crescita del potere d’acquisto.","formulas":["Importo rivalutato = Importo iniziale × (I finale/I iniziale)","Valore reale (prezzi base) = Valore nominale / (Indice prezzi/100)","Variazione reale % = [(fattore nominale/fattore prezzi)−1]×100"],"example":"Canone 900€, FOI 104→106,08: nuovo canone =900×106,08/104=918€.","pitfall":"Non sommare la differenza dei punti dell’indice direttamente all’importo in euro."}]},{"chapter":4,"title":"Fenomeni osservati nel tempo","pages":"46–55","summary":"Serie storiche, componenti, destagionalizzazione e medie mobili.","sections":[{"chapter":4,"title":"Stock, flussi e serie storiche","content":"Una variabile di stock è misurata in un istante: scorte al 31 dicembre, numero di occupati in una data, prezzo in un dato momento. Una variabile di flusso si riferisce a un intervallo: produzione mensile, consumi trimestrali, vendite annuali. Una serie storica è una successione di osservazioni della stessa grandezza nel tempo, spesso equidistanti.","formulas":["Serie storica: {x₁, x₂, …, xₙ}"],"example":"500 merci in magazzino al 31/12 = stock. 500 merci vendute durante dicembre = flusso.","pitfall":"Gli effetti dei giorni lavorativi sono particolarmente rilevanti per i flussi mensili."},{"chapter":4,"title":"Trend, stagionalità, ciclo e componente accidentale","content":"Il trend descrive la tendenza di fondo di lungo periodo. La stagionalità consiste in oscillazioni che si ripetono in particolari periodi dell’anno (per esempio ogni agosto). Il ciclo rappresenta l’alternarsi delle fasi economiche su durate generalmente superiori all’anno; la componente accidentale raccoglie variazioni non sistematiche.","formulas":["Modello additivo: xₜ=Tₜ+Cₜ+Sₜ+aₜ","Modello moltiplicativo: xₜ=Tₜ×Cₜ×Sₜ×aₜ"],"example":"","pitfall":"Una recessione pluriennale non è “stagionalità”: non si ripresenta per definizione nello stesso mese."},{"chapter":4,"title":"Correzione per gli effetti di calendario","content":"Nei dati di flusso mesi con diverso numero di giorni lavorativi possono mostrare valori totali diversi anche a produttività costante. Un metodo illustrativo nella dispensa riporta prima il flusso a una media giornaliera e poi a una lunghezza convenzionale del periodo. La correzione effettiva Istat può essere più articolata.","formulas":["Media giornaliera = xₘ/Nₘ","Valore corretto illustrativo = (xₘ/Nₘ)×N standard"],"example":"600 unità in 20 giorni e 660 in 22 giorni: entrambe sono 30 unità/giorno; un aumento grezzo non implica produttività maggiore.","pitfall":"Non confondere la correzione calendario con la deflazione: risolvono problemi diversi."},{"chapter":4,"title":"Destagionalizzazione e lettura congiunturale","content":"La destagionalizzazione stima e rimuove l’effetto delle oscillazioni che ritornano sistematicamente nel calendario. Nei dati sulla produzione si correggono prima gli effetti di calendario, poi la stagionalità. I confronti fra mesi vicini sono più informativi sulla serie destagionalizzata; per i confronti tra lo stesso mese di due anni spesso si usa la serie corretta per il calendario. La dispensa osserva che per i prezzi al consumo la stagionalità è parte del fenomeno, quindi non si destagionalizzano ordinariamente gli indici pubblicati.","formulas":[],"example":"","pitfall":"Non ogni serie deve essere destagionalizzata e non ogni variazione fra due mesi è segno di un mutamento strutturale."},{"chapter":4,"title":"Medie mobili semplici e centrate","content":"Una media mobile riduce le oscillazioni rapide sostituendo un valore con la media di un gruppo di osservazioni vicine. La media semplice attribuisce uguale peso ai termini. La media centrata di ordine dispari usa lo stesso numero di osservazioni prima e dopo il periodo. Agli estremi mancano osservazioni necessarie; aumentando l’ordine normalmente aumenta il lisciamento.","formulas":["MM a 3 termini: Mₜ=(xₜ₋₁+xₜ+xₜ₊₁)/3","MM semplice di ordine 2q+1: Mₜ=[Σⱼ₌₋qᵠ xₜ₊ⱼ]/(2q+1)"],"example":"x = 3,2,7,9,8: M₂=(3+2+7)/3=4; M₃=(2+7+9)/3=6.","pitfall":"Le medie centrate non si possono assegnare automaticamente alle osservazioni iniziali e finali."},{"chapter":4,"title":"Medie mobili di ordine pari e stagionalità annuale","content":"Con una stagionalità di periodo s, per attenuarla si impiegano medie mobili di ordine s; ad esempio 12 termini per una serie mensile con stagionalità annuale e 4 per una trimestrale. Se l’ordine è pari, il centro cade tra due periodi: si mediano due medie mobili consecutive, ottenendo una versione centrata con pesi dimezzati alle estremità.","formulas":["MM centrata mensile di ordine 12: [0,5xₜ₋₆+xₜ₋₅+…+xₜ₊₅+0,5xₜ₊₆]/12"],"example":"","pitfall":"Una media a 5 termini su dati mensili con stagionalità annuale non elimina la componente stagionale di periodo 12."}]},{"chapter":5,"title":"Produzione industriale","pages":"56–60","summary":"Come leggere l’indice Istat della produzione in volume.","sections":[{"chapter":5,"title":"Che cos’è l’indice della produzione industriale","content":"L’IPI Istat misura le variazioni nel tempo del volume fisico della produzione industriale in senso stretto, con esclusione delle costruzioni. È un indicatore mensile utile per leggere la congiuntura. Studia le quantità, quindi non deve confondere un aumento dei prezzi con maggiore produzione. La rilevazione coinvolge un campione/panel di imprese che forniscono informazioni su prodotti rappresentativi.","formulas":[],"example":"","pitfall":"Un aumento del fatturato dovuto soltanto al prezzo non è aumento della produzione reale."},{"chapter":5,"title":"Indice a catena di Laspeyres delle quantità","content":"Secondo il metodo descritto nella dispensa, da gennaio 2022 l’IPI è costruito mediante un indice a catena di Laspeyres. Gli indici delle singole produzioni sono ponderati per l’importanza economica; dicembre dell’anno precedente è il periodo di raccordo. Paniere, imprese e pesi sono aggiornati periodicamente per riflettere la struttura produttiva.","formulas":["Laspeyres quantità (base s): Iₛ,ₜ=Σ(pₛqₜ)/Σ(pₛqₛ)","Concatenamento: I₀,ₜᴄ=I₀,ₛᴄ×Iₛ,ₜ"],"example":"Indice a dicembre=108, indice relativo del mese=1,05: concatenato=108×1,05=113,4.","pitfall":"Non mescolare un indice in forma relativa (1,05) con uno espresso in base 100 (105) senza adeguare la scala."},{"chapter":5,"title":"Proxy della produzione e finalità","content":"La grandezza economica desiderata sarebbe il valore aggiunto a prezzi costanti, ma una sua stima mensile diretta è difficile e tardiva. Per produrre indicatori tempestivi si utilizzano informazioni che ne seguono la dinamica: quantità fisiche prodotte, valore della produzione deflazionato e ore lavorate opportunamente corrette per produttività. Nessuna di queste è perfetta; sono approssimazioni operative.","formulas":[],"example":"","pitfall":"Deflazionare il valore nominale significa rimuovere l’effetto dei prezzi, non calcolare un aumento nominale."},{"chapter":5,"title":"Grezzo, calendario, destagionalizzato e revisioni","content":"L’IPI grezzo è il dato prima delle correzioni; quello corretto per il calendario evita che il numero dei giorni lavorativi distorca i confronti tra gli stessi periodi di anni diversi; quello destagionalizzato consente migliori confronti mensili o trimestrali consecutivi. I dati più recenti sono provvisori e soggetti a revisione quando arrivano ulteriori risposte o vengono aggiornate le procedure di stima.","formulas":[],"example":"Un valore grezzo può crescere sullo stesso mese dell’anno precedente grazie a un giorno lavorativo in più, mentre la crescita corretta è inferiore.","pitfall":"Per la congiuntura preferisci una serie destagionalizzata; per il confronto tendenziale una corretta per il calendario."}]},{"chapter":6,"title":"Contabilità nazionale e PIL","pages":"61–72","summary":"Risorse e impieghi, PIL nominale e reale, valori concatenati e deflatore.","sections":[{"chapter":6,"title":"Contabilità nazionale: cosa descrive","content":"I conti nazionali ricostruiscono il circuito dell’attività economica: produzione, distribuzione dei redditi, consumi, risparmio, accumulazione e rapporti con l’estero. Seguono uno schema europeo armonizzato (SEC 2010) e registrano risorse e impieghi. Si distinguono grandezze lorde (prima del consumo di capitale fisso) e nette (dopo ammortamenti). Le stime sono soggette a revisioni.","formulas":[],"example":"","pitfall":"Non confondere saldo lordo con saldo netto: la differenza riguarda il consumo di capitale fisso."},{"chapter":6,"title":"Territorio economico, residenza, PIL e RNL","content":"L’aggregato interno si riferisce alla produzione delle unità residenti operanti nel territorio economico; quello nazionale considera i redditi attribuiti ai residenti. Il PIL misura il risultato finale dell’attività produttiva interna; l’RNL aggiunge i redditi primari ricevuti dall’estero e sottrae quelli destinati ai non residenti. Una filiale italiana di impresa estera può essere residente in Italia ai fini della contabilità.","formulas":["RNL = PIL + redditi primari dall’estero − redditi primari verso l’estero"],"example":"PIL 1.000, redditi dall’estero 70, verso l’estero 40 → RNL=1.030.","pitfall":"Il PIL non è la somma dei redditi dei soli cittadini italiani: il criterio non è la nazionalità giuridica."},{"chapter":6,"title":"Produzione market/non market e economia non osservata","content":"La produzione market è destinata al mercato; quella non market comprende servizi erogati gratuitamente o a prezzi non significativi da determinati operatori. L’esaustività dei conti richiede stime del sommerso economico, sommerso statistico, attività informali e alcune attività illegali basate su scambi volontari. Queste componenti entrano secondo definizioni internazionali, non perché siano legalizzate.","formulas":[],"example":"","pitfall":"L’economia non osservata non coincide soltanto con l’economia illegale o soltanto con il sommerso fiscale."},{"chapter":6,"title":"Valore aggiunto e PIL ai prezzi di mercato","content":"Il valore aggiunto elimina i consumi intermedi per evitare doppi conteggi. Si ottiene dalla produzione meno beni e servizi intermedi utilizzati. Il PIL ai prezzi di mercato si ricava sommando al valore aggiunto ai prezzi base le imposte sui prodotti al netto dei contributi.","formulas":["VA = produzione − consumi intermedi","PIL prezzi mercato = Σ VA prezzi base + imposte prodotti − contributi prodotti"],"example":"Produzione 500, consumi intermedi 300, imposte 30, contributi 10: VA=200; PIL pm=220.","pitfall":"Se le imposte sono già fornite al netto dei contributi non devi sottrarre una seconda volta i contributi."},{"chapter":6,"title":"Consumi, investimenti, importazioni ed esportazioni","content":"I consumi finali soddisfano direttamente bisogni individuali o collettivi. Gli investimenti fissi sono beni materiali o immateriali usati durevolmente nella produzione; gli investimenti lordi includono il consumo di capitale che va sottratto per ottenere quelli netti. La variazione delle scorte può essere positiva o negativa. Le esportazioni sono domanda estera di produzione interna; le importazioni sono risorse provenienti dall’estero.","formulas":["Investimenti netti = investimenti lordi − ammortamenti","Stock capitale Kₜ = Kₜ₋₁ + investimenti − ammortamenti","Domanda estera netta = X − M"],"example":"","pitfall":"L’acquisto di una casa da parte di una famiglia non è un consumo corrente nello schema dei conti nazionali."},{"chapter":6,"title":"Identità delle risorse e degli impieghi","content":"Le risorse disponibili comprendono produzione interna (PIL) e importazioni. Gli impieghi comprendono consumi finali, investimenti fissi lordi, variazione delle scorte e oggetti di valore, esportazioni. L’identità consente di calcolare un aggregato mancante dalle altre componenti.","formulas":["PIL + M = C + I + ΔS + X","PIL = C + I + ΔS + X − M"],"example":"C=700, I=240, ΔS=−20, X=150, M=170 → PIL=900.","pitfall":"Le importazioni si sottraggono quando isoli il PIL; la variazione negativa delle scorte va mantenuta con il proprio segno."},{"chapter":6,"title":"PIL nominale, reale e valori concatenati","content":"Il PIL nominale valuta le quantità ai prezzi correnti: cresce se crescono prezzi o quantità. Il PIL reale cerca di isolare le variazioni di volume. Il metodo tradizionale a prezzi costanti usa una base fissa; il concatenamento parte da indici di quantità a base mobile con prezzi dell’anno precedente, li moltiplica e applica il prodotto al PIL dell’anno di riferimento. Il sistema aggiorna le ponderazioni, ma in generale i valori concatenati perdono additività.","formulas":["PIL nominale: Σ(pₜqₜ)","PIL prezzi base: Σ(p₀qₜ)","Indice quantità t−1→t: Σ(pₜ₋₁qₜ)/Σ(pₜ₋₁qₜ₋₁)","PIL concatenato t = PIL concatenato t−1 × indice volume t−1→t"],"example":"","pitfall":"La somma dei valori concatenati dei singoli settori non coincide necessariamente con il concatenato del totale."},{"chapter":6,"title":"Deflatore implicito e differenza da NIC","content":"Il deflatore implicito del PIL è il rapporto tra valore nominale e concatenato. Confrontando i deflatori di due anni puoi calcolare la componente dei prezzi. Il NIC, invece, segue i prezzi dei consumi delle famiglie; i due indicatori coprono aggregati diversi e possono evolvere diversamente.","formulas":["Dₜ = (PIL nominaleₜ/PIL concatenatoₜ)×100","Variazione deflatore % = [(Dₜ/Dₜ₋₁)−1]×100"],"example":"Nominale 1.560, concatenato 1.500 → deflatore=104.","pitfall":"Il deflatore è il rapporto nominale/reale, NON reale/nominale."}]},{"chapter":7,"title":"Forze di lavoro e affidabilità","pages":"73–78","summary":"Tassi del mercato del lavoro, stime, CV e intervalli di confidenza.","sections":[{"chapter":7,"title":"L’indagine Istat sulle forze di lavoro","content":"È una rilevazione campionaria continua che stima occupazione, disoccupazione e inattività e descrive professioni, ore lavorate e contratti. Si selezionano comuni e famiglie con disegno a due stadi. La famiglia è unità di rilevazione; il singolo individuo è unità d’analisi. Il sistema di rotazione 2-2-2 osserva ciascuna famiglia per due trimestri, fa una pausa di due e la intervista ancora per due. La prima intervista è generalmente personale (CAPI), le successive telefoniche (CATI).","formulas":[],"example":"","pitfall":"Non confondere unità di rilevazione (famiglia) e unità di analisi (persona)."},{"chapter":7,"title":"Occupati, disoccupati e inattivi","content":"Sono occupate le persone 15–89 anni che lavorano almeno un’ora nella settimana di riferimento per retribuzione o profitto, e alcuni temporaneamente assenti secondo regole specifiche. Sono disoccupate le persone 15–74 anni senza lavoro che cercano attivamente e sono disponibili entro i termini previsti; esistono criteri anche per chi ha già trovato un impiego prossimo. Gli inattivi non ricadono in nessuna delle altre due categorie. Le forze di lavoro sono occupati + disoccupati.","formulas":["Forze di lavoro FL = O + D","Popolazione di riferimento = O + D + inattivi"],"example":"Studente senza lavoro che non cerca impiego: inattivo, non disoccupato.","pitfall":"Non lavorare non basta per essere classificati come disoccupati."},{"chapter":7,"title":"Tassi di occupazione, attività, inattività e disoccupazione","content":"Il tasso di occupazione confronta occupati e popolazione di riferimento della stessa fascia d’età (spesso 15–64). Il tasso di attività riguarda chi è nelle forze di lavoro; quello di inattività chi non partecipa. Il tasso di disoccupazione usa come denominatore le forze di lavoro, non tutta la popolazione. I tassi permettono confronti in regioni e anni diversi.","formulas":["T. occupazione = O/P ×100","T. attività = FL/P ×100","T. inattività = inattivi/P ×100","T. disoccupazione = D/FL ×100","T. attività + T. inattività = 100%"],"example":"Popolazione=1.000, occupati=650, disoccupati=100: FL=750, occupazione 65%, attività 75%, inattività 25%, disoccupazione ≈13,3%.","pitfall":"Attenzione alla fascia d’età coerente fra numeratore e denominatore e al denominatore delle disoccupazione."},{"chapter":7,"title":"Errore standard e coefficiente di variazione","content":"Le statistiche campionarie sono stime variabili da campione a campione. L’errore standard misura la deviazione standard stimata dello stimatore; il coefficiente di variazione è il rapporto fra errore standard e valore stimato. A parità delle altre condizioni, SE e CV minori indicano stime più precise. Il CV serve a confrontare errori relativi di grandezze molto diverse.","formulas":["SE = √Var stimata(stimatore)","CV = SE/stima","SE = stima×CV"],"example":"Stima 1.000, SE 20 → CV=0,02=2%.","pitfall":"Un SE assoluto più piccolo non implica automaticamente migliore precisione relativa; bisogna considerare la grandezza della stima."},{"chapter":7,"title":"Intervalli di confidenza al 95%","content":"Per uno stimatore non distorto normalmente o approssimativamente normalmente distribuito, l’intervallo al 95% ha estremi stima ±1,96×SE. Il livello di confidenza descrive una procedura: ripetendola su molti campioni, circa il 95% degli intervalli coprirebbe il vero parametro. Un intervallo più largo indica maggiore incertezza.","formulas":["IC95% = [stima−1,96×SE; stima+1,96×SE]","Se CV è noto: IC95% = stima ± 1,96×stima×CV"],"example":"Stima 1.000, CV=0,02 → IC=1.000±1,96×1.000×0,02.","pitfall":"Per CV=0,5% usare 0,005, non 0,5. Il 95% non è la probabilità assegnata al parametro fisso dopo aver osservato l’intervallo."}]},{"chapter":8,"title":"Concentrazione e disuguaglianza","pages":"79–95","summary":"Quote cumulate, curva di Lorenz, Gini e S80/S20.","sections":[{"chapter":8,"title":"Concentrazione e variabili trasferibili","content":"La concentrazione studia come un ammontare sia ripartito tra le unità: reddito, ricchezza, fatturato, addetti o superficie agricola. La variabile deve essere quantitativa e trasferibile, almeno concettualmente, tra unità. L’altezza o l’età non hanno una interpretazione economica usuale di concentrazione, pur essendo numeri. Minima concentrazione: tutte le unità possiedono lo stesso ammontare. Massima concentrazione: una sola unità possiede tutto.","formulas":[],"example":"","pitfall":"Prima di applicare Gini, controlla che la variabile sia trasferibile nel senso della dispensa."},{"chapter":8,"title":"Ordinamento e quote cumulate pᵢ e qᵢ","content":"Ordina gli ammontari dal minore al maggiore: x₁≤…≤xₙ. La quota cumulata delle unità pᵢ è i/n. La quota cumulata dell’ammontare qᵢ è la somma dei primi i ammontari divisa per il totale A. Per redditi ordinati si ha qᵢ≤pᵢ, con uguaglianza in ogni punto in caso di equidistribuzione.","formulas":["A=Σxᵢ","pᵢ=i/n","qᵢ=(x₁+…+xᵢ)/A"],"example":"Redditi 10,20,30,40 (totale 100): p₂=2/4=0,5; q₂=(10+20)/100=0,3: il 50% più povero possiede il 30%.","pitfall":"Per qᵢ si sommano gli ammontari, non le frequenze delle unità."},{"chapter":8,"title":"Indice di Gini esatto per dati individuali","content":"Il rapporto di concentrazione di Gini normalizzato della dispensa confronta le differenze pᵢ−qᵢ con quelle massime possibili. Varia fra 0 (equidistribuzione) e 1 (massima concentrazione). Una forma comoda per dati ordinati usa le prime n−1 quote cumulate qᵢ.","formulas":["Gini R = Σᵢ₌₁ⁿ⁻¹(pᵢ−qᵢ)/Σᵢ₌₁ⁿ⁻¹pᵢ","Forma equivalente: R = 1−[2/(n−1)]Σᵢ₌₁ⁿ⁻¹qᵢ"],"example":"Redditi 10,20,30,40: q₁=0,1, q₂=0,3, q₃=0,6 → R=1−(2/3)×1=1/3≈0,33.","pitfall":"Per piccoli n occorre il fattore di normalizzazione (n−1): il Gini non normalizzato può dare valori diversi."},{"chapter":8,"title":"Curva di Lorenz e area di concentrazione","content":"Sull’asse orizzontale si rappresenta la quota cumulata p delle unità ordinate, sull’asse verticale la quota cumulata q della grandezza. La retta q=p è l’equidistribuzione; la curva di Lorenz giace sotto o sulla retta. Maggiore è l’area tra le due, maggiore è la concentrazione. Per dati raggruppati si può approssimare l’area sotto la spezzata con trapezi.","formulas":["Area sotto Lorenz ≈ ½Σ(qᵢ+qᵢ₊₁)(pᵢ₊₁−pᵢ)","Gini approssimato = 1−Σ(qᵢ+qᵢ₊₁)(pᵢ₊₁−pᵢ)"],"example":"","pitfall":"Due curve di Lorenz che si incrociano non sempre consentono un confronto univoco con il solo ordinamento grafico."},{"chapter":8,"title":"Dati raggruppati per classi","content":"Se si conoscono soltanto classi di reddito o superficie, si approssima l’ammontare di ciascuna con frequenza × valore centrale della classe. Si costruiscono poi pᵢ e qᵢ cumulati e la spezzata di Lorenz. L’approssimazione trascura la disuguaglianza interna alle classi, di norma sottostimando la concentrazione.","formulas":[],"example":"Classe 0–10 con 20 unità: centro=5, ammontare stimato=100. Ripeti per le altre classi per ricavare le quote del totale.","pitfall":"Non utilizzare la formula per dati individuali con n=numero classi senza adattare il metodo: occorre considerare frequenze e quote cumulate."},{"chapter":8,"title":"Proprietà di Gini e rapporto S80/S20","content":"Gini è invariante a una moltiplicazione di tutti gli importi per una stessa costante positiva, ma può diminuire aggiungendo a tutti lo stesso importo. Trasferire da una unità meno ricca a una più ricca tende ad accrescere la concentrazione. L’indicatore S80/S20 confronta l’ammontare del 20% più ricco e del 20% più povero. È più focalizzato sugli estremi rispetto al Gini, che riassume l’intera distribuzione.","formulas":["S80/S20 = reddito totale 20% più ricco / reddito totale 20% più povero"],"example":"Se il quinto più ricco possiede il 40% del reddito e il più povero l’8%, S80/S20=40/8=5.","pitfall":"S80/S20 è un rapporto, NON la differenza fra due percentuali."}]},{"chapter":9,"title":"Reddito, consumi e povertà","pages":"96–112","summary":"Indagini sulle famiglie, scale equivalenti e povertà relativa/assoluta.","sections":[{"chapter":9,"title":"Indagine sui bilanci delle famiglie della Banca d’Italia","content":"La Banca d’Italia svolge un’indagine campionaria sui bilanci familiari che studia redditi, patrimoni, consumi e aspetti economici delle famiglie. Il disegno è a due stadi (comuni e famiglie) e comprende osservazioni panel delle stesse famiglie in più edizioni. La rilevazione CAPI può incontrare risposte parziali, rifiuti e sottodichiarazione di redditi; le non risposte selettive possono alterare i risultati.","formulas":[],"example":"","pitfall":"La famiglia può essere unità di rilevazione anche quando si costruiscono successivamente indicatori riferiti agli individui."},{"chapter":9,"title":"Reddito medio, mediano e variazioni reali","content":"Il reddito medio è la somma divisa per il numero delle famiglie; la mediana è il valore che lascia metà delle famiglie da ciascun lato. L’asimmetria positiva dei redditi fa spesso risultare la media superiore alla mediana. Per confrontare il potere d’acquisto nel tempo occorre deflazionare il reddito nominale con un indice dei prezzi appropriato, come il deflatore dei consumi delle famiglie illustrato dalla dispensa.","formulas":[],"example":"","pitfall":"Un aumento nominale del reddito non implica necessariamente aumento reale del tenore di vita."},{"chapter":9,"title":"Reddito equivalente e scala OCSE modificata","content":"Il reddito familiare complessivo non è confrontabile direttamente tra famiglie di diversa composizione; le economie di scala permettono di condividere beni come casa e riscaldamento. Nella scala OCSE modificata il primo adulto pesa 1, ogni altro componente di almeno 14 anni 0,5 e ogni minore di 14 anni 0,3. Il reddito equivalente è il reddito familiare diviso per la somma dei pesi. Non è un denaro effettivamente distribuito a ciascuna persona.","formulas":["Peso equivalente =1+0,5×(altri ≥14)+0,3×(minori 14)","Reddito equivalente = reddito familiare/peso equivalente"],"example":"Due adulti e due bambini sotto 14 anni: peso=1+0,5+0,3+0,3=2,1; reddito 42.000→equivalente=42.000/2,1.","pitfall":"L’indagine Istat sulla spesa impiega una propria scala di equivalenza, non necessariamente la OCSE modificata."},{"chapter":9,"title":"Indagine Istat sulla spesa per consumi","content":"L’Istat rileva le spese delle famiglie per beni e servizi di consumo, anche attraverso diari settimanali e interviste. Sono inclusi secondo la metodologia anche autoconsumi e alcuni fitti figurativi; l’acquisto di una casa non rappresenta ordinariamente consumo finale corrente. Si distinguono spesa media e mediana; la spesa equivalente corregge le differenze di ampiezza familiare con una scala.","formulas":["Spesa media = somma delle spese familiari/numero famiglie"],"example":"","pitfall":"Un fitto figurativo è una valutazione imputata del servizio abitativo, non un canone monetario effettivamente pagato."},{"chapter":9,"title":"Soglia, incidenza e intensità della povertà","content":"Una linea di povertà z consente di classificare famiglie povere e non povere. L’incidenza H=q/n è la frequenza dei poveri sul totale: misura quante famiglie sono povere. L’intensità I=(z−ȳ)/z è il divario relativo fra soglia e consumo medio dei soli poveri: misura quanto sono lontani dalla soglia. Si può isolare ȳ=z(1−I), utile in molti quiz.","formulas":["H = famiglie povere/famiglie totali","I = (z−consumo medio poveri)/z","Consumo medio poveri = z(1−I)"],"example":"Incidenza=10%: 10 famiglie su 100 sono povere. Soglia=1.000, intensità=20%: il consumo medio poveri è 800.","pitfall":"L’intensità non è la percentuale di famiglie povere. Attenzione a convertire 21,4% in 0,214 prima di applicare la formula."},{"chapter":9,"title":"Povertà relativa: Istat e Banca d’Italia","content":"Per la povertà relativa Istat, nella metodologia della dispensa, la linea di una famiglia di due componenti corrisponde alla spesa media mensile pro capite nazionale; per altre dimensioni familiari si usano coefficienti di equivalenza. Nell’indagine sui bilanci della Banca d’Italia la soglia descritta è metà della mediana del reddito o consumo equivalente. Le percentuali prodotte dalle due fonti possono differire anche perché cambiano definizioni e campioni.","formulas":["Soglia Istat (2 componenti) = spesa media mensile pro capite","Soglia Banca d’Italia = 0,50×mediana equivalente"],"example":"","pitfall":"Non prendere la spesa media mensile per famiglia come linea di povertà Istat per due componenti: nella dispensa serve la spesa pro capite."},{"chapter":9,"title":"Povertà assoluta","content":"La povertà assoluta è individuata confrontando la spesa familiare con il costo di un paniere di beni e servizi essenziali per una vita minimamente accettabile. Le soglie dipendono da numero ed età dei componenti, macroarea geografica e ampiezza del comune. Non è semplicemente un’altra percentuale fissa della media o della mediana. La povertà relativa confronta la posizione delle famiglie con lo standard prevalente nel contesto sociale.","formulas":[],"example":"","pitfall":"Due famiglie con pari spesa ma composizioni e residenze differenti possono avere soglie assolute diverse."},{"chapter":9,"title":"EU-SILC: rischio di povertà ed esclusione sociale","content":"EU-SILC raccoglie dati comparabili sul reddito e le condizioni di vita in Europa, anche longitudinalmente. L’indicatore di rischio di povertà usa il 60% della mediana del reddito disponibile equivalente dopo trasferimenti sociali. La dispensa espone gli indicatori storici di grave deprivazione materiale (almeno 4 su 9 condizioni), bassa intensità lavorativa (rapporto mesi lavorati/mesi potenziali sotto 0,20) e rischio di povertà o esclusione sociale (almeno una delle condizioni). Le percentuali dei tre gruppi non si sommano perché le persone possono appartenere a più gruppi.","formulas":["Rischio povertà EU-SILC: reddito equivalente < 0,60×mediana","Intensità lavorativa = mesi effettivi lavorati/mesi potenziali lavorabili"],"example":"","pitfall":"Non confondere 60% della mediana EU-SILC con 50% della mediana nell’indagine Banca d’Italia citata."}]}];
const FORMULAS=[{"chapter":1,"group":"Campionamento","title":"Passo del campionamento sistematico","formula":"k = N / n","explain":"N = unità della lista; n = unità da selezionare. Partendo da un numero casuale iniziale, si seleziona un’unità ogni k posizioni.","warning":"Se N/n non è intero servono regole di arrotondamento o selezione adeguate."},{"chapter":1,"group":"Campionamento","title":"Frazione campionaria","formula":"f = n / N","explain":"È la quota della popolazione selezionata nel campione.","warning":"La frazione campionaria non è il tasso di risposta."},{"chapter":1,"group":"Campionamento stratificato","title":"Numerosità del campione stratificato","formula":"n = n₁ + n₂ + … + nₕ","explain":"Il campione complessivo è la somma delle unità selezionate nei diversi strati.","warning":"Se uno strato è censito, per quello strato nₕ = Nₕ."},{"chapter":1,"group":"Qualità delle risposte","title":"Quota di mancate risposte","formula":"Quota non risposte = unità non rispondenti / unità contattate × 100","explain":"Indicatore descrittivo della mancata risposta; distingue l’assenza di risposta dagli errori di risposta.","warning":"Una bassa quota di non risposte non elimina automaticamente i rischi di distorsione."},{"chapter":2,"group":"Rapporti statistici","title":"Rapporto di composizione","formula":"R = parte / totale × 100","explain":"Misura quanto pesa una parte all’interno del suo totale.","warning":"Il denominatore contiene la parte che compare al numeratore."},{"chapter":2,"group":"Rapporti statistici","title":"Rapporto di coesistenza","formula":"R = ammontare A / ammontare B × 100","explain":"Confronta due componenti distinte di uno stesso collettivo, es. maschi per 100 femmine.","warning":"A e B non sono necessariamente una parte del proprio denominatore."},{"chapter":2,"group":"Rapporti statistici","title":"Rapporto di derivazione","formula":"R = eventi / popolazione di riferimento × k","explain":"Rapporta l’ammontare di un fenomeno alla popolazione da cui deriva; k può valere 100 o 1.000.","warning":"Individua sempre la popolazione di riferimento corretta."},{"chapter":2,"group":"Indici semplici","title":"Indice a base fissa","formula":"I₀,ₜ = (xₜ / x₀) × 100","explain":"Confronta il valore al tempo t con lo stesso periodo base 0.","warning":"Un indice 115 significa +15% rispetto alla base, non +115%."},{"chapter":2,"group":"Indici semplici","title":"Indice a base mobile","formula":"Iₜ₋₁,ₜ = (xₜ / xₜ₋₁) × 100","explain":"Confronta ogni periodo con quello immediatamente precedente.","warning":"Non confondere 2022/2021 con 2022/anno base fisso."},{"chapter":2,"group":"Indici semplici","title":"Cambio di base","formula":"Iᵇₜ = (Iᵃₜ / Iᵃᵦ) × 100","explain":"Esprime un indice con nuova base b=100 a partire da indici nella vecchia base a.","warning":"La base nuova va al denominatore."},{"chapter":2,"group":"Indici semplici","title":"Concatenamento","formula":"I₀,₂ = (I₀,₁ × I₁,₂) / 100","explain":"Con indici espressi in base 100, collega più intervalli consecutivi.","warning":"Se gli indici sono in forma relativa (es. 1,05), si moltiplicano senza dividere per 100."},{"chapter":2,"group":"Variazioni","title":"Variazione assoluta","formula":"Δx = xₜ − xₜ₋₁","explain":"Differenza nelle unità di misura originali della variabile.","warning":"Il risultato non è una percentuale."},{"chapter":2,"group":"Variazioni","title":"Variazione percentuale","formula":"r% = [(xₜ / xₜ₋₁) − 1] × 100","explain":"Misura l’aumento o la diminuzione rispetto al periodo precedente.","warning":"Al denominatore c’è sempre il valore iniziale."},{"chapter":2,"group":"Variazioni","title":"Variazioni successive","formula":"xₜ / x₀ = (1+r₁) × (1+r₂) × … × (1+rₜ)","explain":"Per tassi in forma relativa, le variazioni si combinano moltiplicativamente.","warning":"+10% e −10% consecutivi NON si annullano."},{"chapter":2,"group":"Indici complessi","title":"Indice di valore","formula":"V₀,ₜ = Σ(pₜqₜ) / Σ(p₀q₀)","explain":"Cambia contemporaneamente i prezzi p e le quantità q.","warning":"Non è un indice puro dei prezzi né delle quantità."},{"chapter":2,"group":"Indici complessi","title":"Laspeyres dei prezzi","formula":"Lₚ = Σ(pₜq₀) / Σ(p₀q₀)","explain":"Confronta prezzi correnti e iniziali con quantità del periodo base q₀.","warning":"Le quantità sono q₀ sia sopra sia sotto."},{"chapter":2,"group":"Indici complessi","title":"Paasche dei prezzi","formula":"Pₚ = Σ(pₜqₜ) / Σ(p₀qₜ)","explain":"Confronta i prezzi con le quantità correnti qₜ.","warning":"Le quantità sono qₜ sia sopra sia sotto."},{"chapter":2,"group":"Indici complessi","title":"Fisher dei prezzi","formula":"Fₚ = √(Lₚ × Pₚ)","explain":"Media geometrica degli indici di prezzo di Laspeyres e Paasche, nelle stesse unità.","warning":"Se L e P sono entrambi base 100, anche Fisher è base 100."},{"chapter":2,"group":"Indici complessi","title":"Laspeyres delle quantità","formula":"Lᵩ = Σ(p₀qₜ) / Σ(p₀q₀)","explain":"Mantiene costanti i prezzi iniziali p₀, variando le quantità.","warning":"Qui è il prezzo a rimanere fisso."},{"chapter":2,"group":"Indici complessi","title":"Paasche delle quantità","formula":"Pᵩ = Σ(pₜqₜ) / Σ(pₜq₀)","explain":"Mantiene costanti i prezzi correnti pₜ, variando le quantità.","warning":"Non invertire numeratore e denominatore."},{"chapter":2,"group":"Indici complessi","title":"Scomposizione valore-prezzi-volumi","formula":"Iᵖ implicito = Iᵛᵃˡᵒʳᵉ / Iᵛᵒˡᵘᵐᵉ","explain":"Il rapporto tra indice di valore e indice di volume isola l’effetto implicito dei prezzi.","warning":"Gli indici devono essere espressi in forma coerente."},{"chapter":3,"group":"Inflazione","title":"Inflazione congiunturale","formula":"rₘ = (Iₘ / Iₘ₋₁ − 1) × 100","explain":"Variazione percentuale rispetto al mese precedente.","warning":"È un confronto mensile, non con lo stesso mese dell’anno prima."},{"chapter":3,"group":"Inflazione","title":"Inflazione tendenziale","formula":"rᵗₘ = (Iₘ,anno / Iₘ,anno−1 − 1) × 100","explain":"Confronto dello stesso mese in due anni consecutivi.","warning":"Non usare il mese precedente."},{"chapter":3,"group":"Inflazione","title":"Inflazione media annua","formula":"πₐ = (Īₜ / Īₜ₋₁ − 1) × 100","explain":"Īₜ è la media dei dodici indici mensili dell’anno t.","warning":"Non è la semplice media delle dodici variazioni congiunturali."},{"chapter":3,"group":"Inflazione","title":"Inflazione acquisita al mese m","formula":"πacq = {[(Σₖ₌₁ᵐ Iₖ + (12−m)Iₘ)/12] / Īₜ₋₁ − 1} × 100","explain":"Si ipotizza che l’indice dei prezzi resti al livello dell’ultimo mese noto fino a dicembre.","warning":"Inserisci l’indice dell’ultimo mese noto una volta per ogni mese rimanente."},{"chapter":3,"group":"Inflazione","title":"Inflazione ereditata dall’anno precedente","formula":"πered = (I_dic,t−1 / Īₜ₋₁ − 1) × 100","explain":"Confronta dicembre dell’anno precedente con la media del medesimo anno.","warning":"Non usare l’indice medio dell’anno corrente."},{"chapter":3,"group":"Inflazione","title":"Inflazione propria dell’anno","formula":"πpropria = (Īₜ / I_dic,t−1 − 1) × 100","explain":"Parte della dinamica media dei prezzi dovuta a quanto accade durante l’anno corrente.","warning":"La base del confronto è dicembre dell’anno precedente."},{"chapter":3,"group":"Inflazione","title":"Inflazione trasmessa all’anno successivo","formula":"πtrasm = (I_dic,t / Īₜ − 1) × 100","explain":"Effetto di trascinamento dal dicembre dell’anno t al successivo anno t+1.","warning":"È diversa dall’inflazione ereditata dall’anno t−1."},{"chapter":3,"group":"Inflazione","title":"Scomposizione dell’inflazione media","formula":"1 + πmedia = (1 + πered) × (1 + πpropria)","explain":"Usare π in forma decimale, non percentuale; l’identità è moltiplicativa.","warning":"Sommare i tassi è un’approssimazione, non la regola esatta."},{"chapter":3,"group":"Prezzi e redditi","title":"Rivalutazione monetaria FOI","formula":"Importoₜ = Importo₀ × (FOIₜ / FOI₀)","explain":"Per l’indicizzazione monetaria si usa in genere FOI al netto dei tabacchi, con eventuali clausole contrattuali.","warning":"Si moltiplica per il rapporto degli indici, non per la differenza in punti."},{"chapter":3,"group":"Prezzi e redditi","title":"Deflazione a prezzi base","formula":"Valore realeₜ = Valore nominaleₜ / (Iₜ/100)","explain":"Trasforma un aggregato monetario in unità monetarie dell’anno base se I è base 100.","warning":"Se I=110, dividi per 1,10, non per 110."},{"chapter":3,"group":"Prezzi e redditi","title":"Variazione reale tra due anni","formula":"rreale% = {[(Vₜ/V₀) / (Iₜ/I₀)] − 1} × 100","explain":"Divide la variazione nominale per quella dei prezzi.","warning":"Non sottrarre sempre i due tassi: è solo un’approssimazione."},{"chapter":4,"group":"Serie storiche","title":"Variazione congiunturale","formula":"rcong% = (xₜ / xₜ₋₁ − 1) × 100","explain":"Variazione mese su mese o trimestre su trimestre.","warning":"Per analisi congiunturali su serie stagionali servono dati destagionalizzati."},{"chapter":4,"group":"Serie storiche","title":"Variazione tendenziale","formula":"rtend% = (xₜ / xₜ₋ₛ − 1) × 100","explain":"s = numero di periodi in un anno: 12 per mesi, 4 per trimestri.","warning":"Non confondere la distanza s con il periodo precedente."},{"chapter":4,"group":"Effetti di calendario","title":"Produzione per giorno lavorativo","formula":"gₘ = xₘ / giorni lavorativi del mese","explain":"Permette un confronto più corretto tra mesi con diversa numerosità di giornate lavorative.","warning":"Una produzione mensile più alta può dipendere solo da più giorni lavorativi."},{"chapter":4,"group":"Effetti di calendario","title":"Correzione di calendario (schema illustrativo)","formula":"xₘ corretto ≈ (xₘ / giorni effettivi) × giorni standard","explain":"Rende omogenee le osservazioni quando cambia il numero dei giorni lavorativi.","warning":"La procedura ufficiale può essere più complessa di questa equivalenza illustrativa."},{"chapter":4,"group":"Medie mobili","title":"Media mobile centrata a 3 termini","formula":"MMₜ(3) = (xₜ₋₁ + xₜ + xₜ₊₁) / 3","explain":"Smussa la serie usando il periodo t e i suoi vicini.","warning":"Una media di ordine 3 centrata non usa tre valori tutti successivi."},{"chapter":4,"group":"Medie mobili","title":"Media mobile centrata di ordine dispari","formula":"MMₜ(2q+1) = [Σⱼ₌₋q^q xₜ₊ⱼ] / (2q+1)","explain":"Media dei 2q+1 valori centrati in t.","warning":"Serve lo stesso numero di valori prima e dopo il tempo centrale."},{"chapter":4,"group":"Scomposizione","title":"Modello additivo","formula":"xₜ = Tₜ + Cₜ + Sₜ + Aₜ","explain":"Serie come somma di trend, ciclo, stagionalità e componente accidentale.","warning":"Le componenti sono espresse nell’unità originale della serie."},{"chapter":4,"group":"Scomposizione","title":"Modello moltiplicativo","formula":"xₜ = Tₜ × Cₜ × Sₜ × Aₜ","explain":"Modello con componenti stagionali e cicliche proporzionali al livello.","warning":"Non confonderlo con la somma di percentuali."},{"chapter":5,"group":"Produzione industriale","title":"Indice delle quantità di Laspeyres","formula":"Iₛ,ₜᵩ = Σ(pₛqₜ) / Σ(pₛqₛ)","explain":"Misura la variazione delle quantità prodotte mantenendo come pesi i prezzi del periodo s.","warning":"È un indice di volume, non di prezzo."},{"chapter":5,"group":"Produzione industriale","title":"Indice concatenato","formula":"I₀,ₜᶜ = I₀,ₛᶜ × Iₛ,ₜ","explain":"Raccorda il livello concatenato precedente con l’indice relativo successivo; entrambi in forma relativa.","warning":"Con indici base 100, adegua il fattore 100."},{"chapter":5,"group":"Produzione industriale","title":"Variazione mensile della produzione","formula":"r% = (I destag.ₘ / I destag.ₘ₋₁ − 1) × 100","explain":"Per il confronto congiunturale servono gli indici destagionalizzati.","warning":"Non usare la serie grezza se la stagionalità è rilevante."},{"chapter":5,"group":"Produzione industriale","title":"Variazione su dodici mesi","formula":"r% = (Iₘ,ₜ / Iₘ,ₜ₋₁ − 1) × 100","explain":"Confronta lo stesso mese di due anni, dopo le correzioni appropriate.","warning":"Non confondere il confronto tendenziale con quello congiunturale."},{"chapter":6,"group":"Produzione e reddito","title":"Valore aggiunto","formula":"VA = valore della produzione − consumi intermedi","explain":"Rimuove i beni e servizi utilizzati nella produzione per evitare doppi conteggi.","warning":"Non sommare tutte le vendite delle imprese senza sottrarre gli intermedi."},{"chapter":6,"group":"Produzione e reddito","title":"PIL ai prezzi di mercato","formula":"PIL = ΣVA ai prezzi base + imposte sui prodotti − contributi ai prodotti","explain":"Dalla somma dei valori aggiunti si passa al PIL ai prezzi di mercato.","warning":"I contributi vanno sottratti."},{"chapter":6,"group":"Produzione e reddito","title":"Reddito nazionale lordo","formula":"RNL = PIL + redditi primari dall’estero − redditi primari verso l’estero","explain":"La differenza tra interno e nazionale dipende dai redditi con l’estero.","warning":"Non confondere luogo di produzione e residenza dei percettori."},{"chapter":6,"group":"Risorse e impieghi","title":"Identità delle risorse e degli impieghi","formula":"PIL + M = C + I + ΔS + X","explain":"M=importazioni; C=consumi finali; I=investimenti; ΔS=scorte; X=esportazioni.","warning":"Le importazioni stanno tra le risorse."},{"chapter":6,"group":"Risorse e impieghi","title":"PIL dal lato degli impieghi","formula":"PIL = C + I + ΔS + X − M","explain":"Ricava il PIL spostando le importazioni dall’altro lato dell’identità.","warning":"Esportazioni positive, importazioni negative."},{"chapter":6,"group":"Risorse e impieghi","title":"Investimenti netti","formula":"Investimenti netti = investimenti lordi − ammortamenti","explain":"Distingue investimento totale da crescita netta del capitale.","warning":"Non ignorare il consumo di capitale fisso."},{"chapter":6,"group":"Prezzi e volumi","title":"PIL nominale","formula":"PILₜ nominale = Σ(pₜqₜ)","explain":"Valuta la produzione dell’anno t ai prezzi correnti.","warning":"La variazione include effetti di prezzo e quantità."},{"chapter":6,"group":"Prezzi e volumi","title":"PIL a prezzi dell’anno base","formula":"PILₜ reale (base 0) = Σ(p₀qₜ)","explain":"Fissa i prezzi iniziali per isolare le quantità, nel caso a prezzi costanti.","warning":"I valori concatenati sono ottenuti tramite raccordo di indici, non sempre sommabili."},{"chapter":6,"group":"Prezzi e volumi","title":"Indice annuale di volume","formula":"Iᵩₜ₋₁,ₜ = Σ(pₜ₋₁qₜ) / Σ(pₜ₋₁qₜ₋₁)","explain":"Calcola la variazione delle quantità con i prezzi dell’anno precedente.","warning":"Il prezzo di ponderazione è quello di t−1."},{"chapter":6,"group":"Prezzi e volumi","title":"Deflatore implicito del PIL","formula":"Dₜ = (PIL nominaleₜ / PIL concatenatoₜ) × 100","explain":"Rapporto tra valori monetari correnti e valori di volume riferiti alla stessa base.","warning":"Non è il NIC e non misura soltanto i consumi delle famiglie."},{"chapter":6,"group":"Prezzi e volumi","title":"Variazione del deflatore","formula":"πD% = (Dₜ / Dₜ₋₁ − 1) × 100","explain":"Confronta il deflatore di due periodi consecutivi.","warning":"Non confondere il livello Dₜ con la sua variazione percentuale."},{"chapter":7,"group":"Mercato del lavoro","title":"Forze di lavoro","formula":"FL = occupati + disoccupati","explain":"Le forze di lavoro sono il gruppo che partecipa attivamente al mercato del lavoro.","warning":"Gli inattivi non sono nel denominatore del tasso di disoccupazione."},{"chapter":7,"group":"Mercato del lavoro","title":"Popolazione di riferimento","formula":"P = occupati + disoccupati + inattivi","explain":"Deve essere definita per la fascia d’età coerente con il tasso da calcolare.","warning":"Non usare tutta la popolazione se si richiede il tasso 15–64 anni."},{"chapter":7,"group":"Mercato del lavoro","title":"Tasso di occupazione","formula":"TO% = occupati / popolazione della fascia d’età × 100","explain":"Quota di residenti della fascia di riferimento che è occupata.","warning":"Non dividere per le forze di lavoro."},{"chapter":7,"group":"Mercato del lavoro","title":"Tasso di disoccupazione","formula":"TD% = disoccupati / forze di lavoro × 100","explain":"Quota dei partecipanti al mercato del lavoro in cerca di occupazione.","warning":"Il denominatore non è la popolazione totale."},{"chapter":7,"group":"Mercato del lavoro","title":"Tasso di attività","formula":"TA% = forze di lavoro / popolazione della fascia d’età × 100","explain":"Misura la partecipazione attiva al mercato del lavoro.","warning":"Forze di lavoro comprende occupati e disoccupati."},{"chapter":7,"group":"Mercato del lavoro","title":"Tasso di inattività","formula":"TI% = inattivi / popolazione della fascia d’età × 100","explain":"Quota di popolazione che non fa parte delle forze di lavoro.","warning":"Per la stessa popolazione e fascia: TI + TA = 100%."},{"chapter":7,"group":"Stime campionarie","title":"Errore standard","formula":"SE = √[Varianza stimata dello stimatore]","explain":"Misura l’incertezza campionaria della stima nella sua stessa unità di misura.","warning":"Non è la differenza tra la stima e il valore vero, che è ignoto."},{"chapter":7,"group":"Stime campionarie","title":"Errore relativo o coefficiente di variazione","formula":"CV = SE / stima","explain":"Rapporto adimensionale per confrontare la precisione relativa.","warning":"Se è indicato in percentuale, dividi per 100 prima di utilizzarlo nelle formule."},{"chapter":7,"group":"Stime campionarie","title":"Ricavare l’errore standard dal CV","formula":"SE = |stima| × CV","explain":"Con CV in forma decimale, ricavi l’errore standard dalla stima e dall’errore relativo.","warning":"Non moltiplicare per 100 due volte."},{"chapter":7,"group":"Stime campionarie","title":"Intervallo di confidenza al 95%","formula":"IC₉₅ = [stima − 1,96×SE ; stima + 1,96×SE]","explain":"Formula riportata nella dispensa per stimatori non distorti e approssimativamente normali.","warning":"I due estremi sono simmetrici rispetto alla stima."},{"chapter":8,"group":"Quote cumulate","title":"Ammontare complessivo","formula":"A = Σᵢ₌₁ⁿ xᵢ","explain":"Somma dei valori di un carattere trasferibile, ordinati crescentemente.","warning":"Serve una variabile non negativa e trasferibile per l’interpretazione economica."},{"chapter":8,"group":"Quote cumulate","title":"Quota cumulata di unità","formula":"pᵢ = i / n","explain":"Quota dei primi i individui ordinati dal più povero al più ricco.","warning":"I valori vanno prima ordinati in senso non decrescente."},{"chapter":8,"group":"Quote cumulate","title":"Quota cumulata dell’ammontare","formula":"qᵢ = (x₁ + x₂ + … + xᵢ) / A","explain":"Quota cumulata del reddito/fatturato posseduta dai primi i individui.","warning":"Con dati ordinati, qᵢ ≤ pᵢ."},{"chapter":8,"group":"Gini e Lorenz","title":"Gini normalizzato (prima forma)","formula":"R = [Σᵢ₌₁ⁿ⁻¹ (pᵢ − qᵢ)] / [Σᵢ₌₁ⁿ⁻¹ pᵢ]","explain":"Confronta il divario cumulato con il massimo teorico per n osservazioni.","warning":"Valore da 0 (equidistribuzione) a 1 (massima concentrazione)."},{"chapter":8,"group":"Gini e Lorenz","title":"Gini normalizzato (forma rapida)","formula":"R = 1 − [2/(n−1)] × Σᵢ₌₁ⁿ⁻¹ qᵢ","explain":"Formula esatta con osservazioni individuali ordinate e n≥2.","warning":"Per campioni piccoli, NON sostituire n−1 con n."},{"chapter":8,"group":"Gini e Lorenz","title":"Gini con area della curva di Lorenz","formula":"R = [n/(n−1)] × [1 − Σ(qᵢ+qᵢ₊₁)(pᵢ₊₁−pᵢ)]","explain":"Formula esatta con n unità distinte e p₀=q₀=0.","warning":"Il prefattore n/(n−1) è la normalizzazione per numerosità finita."},{"chapter":8,"group":"Dati raggruppati","title":"Valore centrale di una classe","formula":"mᵢ = (limite inferiore + limite superiore) / 2","explain":"Si usa per stimare l’ammontare in una classe quando si conoscono solo gli estremi.","warning":"La stima assume il valore centrale come rappresentativo della classe."},{"chapter":8,"group":"Dati raggruppati","title":"Ammontare stimato per classe","formula":"Aᵢ ≈ frequenzaᵢ × valore centraleᵢ","explain":"Permette di costruire le q
