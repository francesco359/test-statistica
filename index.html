<script>
'use strict';
const QUESTION_BANK=[{"id":"c1-01","chapter":1,"q":"In una rilevazione del fatturato annuo di 250 negozi, qual è l’unità statistica?","options":["Ogni negozio rilevato","Il fatturato totale dei 250 negozi","Il questionario","La media del fatturato"],"correct":0,"why":"L’unità statistica è l’elemento della popolazione sul quale si osservano i caratteri: in questo caso il negozio."},{"id":"c1-02","chapter":1,"q":"Un’indagine intervista le stesse famiglie in diversi anni per studiare l’evoluzione dei consumi. È un’indagine:","options":["censuaria","longitudinale (panel)","necessariamente non probabilistica","solo amministrativa"],"correct":1,"why":"Nelle indagini longitudinali si osservano nuovamente le stesse unità per studiare cambiamenti nel tempo."},{"id":"c1-03","chapter":1,"q":"La popolazione è formata da 840 unità; il campione sistematico ne comprende 70. Se la prima posizione selezionata è 8, quali sono le prime tre?","options":["8, 18, 28","8, 20, 32","8, 78, 148"],"correct":1,"why":"Il passo è k = N/n = 840/70 = 12: si selezionano 8, 20, 32, …"},{"id":"c1-04","chapter":1,"q":"Un campione viene estratto casualmente all’interno di gruppi omogenei definiti in precedenza. Il disegno è:","options":["campionamento per convenienza","campionamento stratificato","campionamento volontario","censimento"],"correct":1,"why":"Il campionamento stratificato suddivide la popolazione in strati e prevede un’estrazione casuale in ciascuno di essi."},{"id":"c1-05","chapter":1,"q":"Prima vengono scelti dei comuni e poi delle famiglie all’interno dei comuni. Di quale disegno si tratta?","options":["Campionamento a due stadi","Campionamento per quote","Campionamento sistematico","Campionamento a valanga"],"correct":0,"why":"I comuni sono unità di primo stadio; le famiglie sono unità di secondo stadio."},{"id":"c1-06","chapter":1,"q":"Quale delle seguenti è una tecnica di campionamento NON probabilistica?","options":["Campionamento casuale semplice","Campionamento casuale stratificato","Campionamento per convenienza","Campionamento sistematico con partenza casuale"],"correct":2,"why":"La selezione per convenienza non si fonda su una probabilità nota di inclusione di ciascuna unità."},{"id":"c1-07","chapter":1,"q":"In un questionario informatizzato l’intervistatore si reca di persona presso il rispondente. Quale sigla identifica la tecnica?","options":["CATI","CAPI","CAWI"],"correct":1,"why":"CAPI = Computer Assisted Personal Interviewing; CATI è telefonica, CAWI via web, PAPI su carta."},{"id":"c1-08","chapter":1,"q":"Una famiglia risponde all’indagine ma omette l’importo delle spese alimentari. Il ricercatore ricostruisce il valore mancante. Quale operazione compie?","options":["Destagionalizzazione","Imputazione","Deflazione","Concatenamento"],"correct":1,"why":"L’imputazione ricostruisce una risposta parziale mancante usando informazioni disponibili e metodi appropriati."},{"id":"c1-09","chapter":1,"q":"Il 35% delle famiglie ad alto reddito non risponde a una rilevazione, mentre quasi tutte le altre rispondono. Il rischio principale è:","options":["distorsione da mancata risposta selettiva","aumento automatico della numerosità campionaria","assenza di errore campionario","cancellazione della variabilità"],"correct":0,"why":"Se la mancata risposta dipende dal fenomeno studiato, la stima può risultare distorta."},{"id":"c1-10","chapter":1,"q":"Quale affermazione sulle indagini censuarie è corretta?","options":["Non presentano mai errori","Coinvolgono tutte le unità della popolazione di riferimento","Sono sempre più rapide di quelle campionarie","Rendono superfluo il controllo di qualità"],"correct":1,"why":"Una rilevazione totale tenta di osservare tutte le unità; possono comunque verificarsi errori di misura e di copertura."},{"id":"c1-11","chapter":1,"q":"Un ente usa archivi fiscali originariamente creati per fini amministrativi. Si tratta di:","options":["rilevazione diretta mediante intervista","utilizzo statistico di dati amministrativi","necessariamente campionamento per quote"],"correct":1,"why":"Le informazioni amministrative possono essere riutilizzate a fini statistici, pur richiedendo controlli di adeguatezza e qualità."},{"id":"c1-12","chapter":1,"q":"Quale vantaggio offre un campione probabilistico rispetto a una selezione volontaria?","options":["Garantisce che nessuno sbagli risposta","Permette di valutare l’errore campionario grazie al meccanismo di selezione","Coinvolge sempre più persone","Elimina la necessità di definire la popolazione"],"correct":1,"why":"La selezione probabilistica definisce probabilità di inclusione e consente l’inferenza e la valutazione dell’errore campionario."},{"id":"c2-01","chapter":2,"q":"In una popolazione ci sono 360 maschi e 300 femmine. Quale formula esprime il rapporto di mascolinità per 100 femmine?","options":["(360/660)×100","(360/300)×100","(300/360)×100","(300/660)×100"],"correct":1,"why":"Il rapporto di coesistenza confronta direttamente maschi e femmine: maschi/femmine ×100."},{"id":"c2-02","chapter":2,"q":"Un territorio conta 2.000 disoccupati e 20.000 persone nelle forze di lavoro. Il tasso di disoccupazione è:","options":["10%","2%","20%","90%"],"correct":0,"why":"Il tasso di disoccupazione è disoccupati/forze di lavoro ×100: 2.000/20.000 = 10%."},{"id":"c2-03","chapter":2,"q":"L’indice semplice di un prezzo passa da 100 nell’anno base a 108 nel periodo corrente. La variazione percentuale è:","options":["108%","8%","−8%"],"correct":1,"why":"Con base 100, l’indice 108 equivale a un aumento dell’8% rispetto alla base."},{"id":"c2-04","chapter":2,"q":"Una grandezza vale 80 nel 2020, 120 nel 2021 e 90 nel 2022. Quale formula dà l’indice del 2022 a base fissa 2020=100?","options":["(90/120)×100","(120/80)×100","(90/80)×100","(80/90)×100"],"correct":2,"why":"Con base fissa 2020 si divide il valore 2022 per quello del 2020."},{"id":"c2-05","chapter":2,"q":"Con i valori 80 (2020), 120 (2021), 90 (2022), quale formula dà l’indice a base mobile 2022/2021?","options":["(90/120)×100","(90/80)×100","(120/80)×100","(120/90)×100"],"correct":0,"why":"L’indice a base mobile confronta il periodo corrente con quello immediatamente precedente."},{"id":"c2-06","chapter":2,"q":"Un indice vale 112 nel 2021 e 119 nel 2022, entrambi in base 2015=100. Come si ribasa il 2022 a 2021=100?","options":["(119−112)×100","(119/112)×100","(112/119)×100","119+112"],"correct":1,"why":"Il cambiamento di base richiede il rapporto fra gli indici espressi nella stessa base precedente."},{"id":"c2-07","chapter":2,"q":"Due indici a base mobile in forma relativa sono 1,20 e 0,90. Quale formula dà l’indice concatenato complessivo in base 100?","options":["(1,20+0,90)×100","(1,20/0,90)×100","1,20×0,90×100"],"correct":2,"why":"Nel concatenamento si moltiplicano gli indici relativi consecutivi e si converte il prodotto in base 100."},{"id":"c2-08","chapter":2,"q":"Prezzi base p₀=(2,4), correnti pₜ=(3,5), quantità base q₀=(10,20). Quale è l’indice dei prezzi di Laspeyres?","options":["[(3×10+5×20)/(2×10+4×20)]×100","[(3×10+5×20)/(3×10+5×20)]×100","[(2×10+4×20)/(3×10+5×20)]×100","[(3+5)/(2+4)]×100"],"correct":0,"why":"Laspeyres dei prezzi usa quantità q₀ in numeratore e denominatore."},{"id":"c2-09","chapter":2,"q":"Prezzi base p₀=(2,4), correnti pₜ=(3,5), quantità correnti qₜ=(12,6). Formula dell’indice dei prezzi di Paasche?","options":["[(3×10+5×20)/(2×10+4×20)]×100","[(3×12+5×6)/(2×12+4×6)]×100","[(2×12+4×6)/(3×12+5×6)]×100","[(3×12+5×6)/(3×12+5×6)]×100"],"correct":1,"why":"Paasche dei prezzi mantiene fisse le quantità correnti qₜ in entrambe le somme."},{"id":"c2-10","chapter":2,"q":"Se Laspeyres dei prezzi vale 121 e Paasche dei prezzi vale 100, quale è Fisher?","options":["121","100","110","221"],"correct":2,"why":"Fisher è la media geometrica √(121×100) = 110."},{"id":"c2-11","chapter":2,"q":"L’espressione [Σ(pₜqₜ)]/[Σ(p₀q₀)] è un indice di:","options":["valore","prezzo di Paasche","quantità di Laspeyres"],"correct":0,"why":"Cambiano sia prezzi sia quantità, quindi viene confrontato il valore complessivo dei beni nei due periodi."},{"id":"c2-12","chapter":2,"q":"Quale espressione rappresenta l’indice di quantità di Laspeyres?","options":["Σ(p₀qₜ)/Σ(p₀q₀)","Σ(pₜqₜ)/Σ(p₀qₜ)","Σ(pₜqₜ)/Σ(pₜq₀)","Σ(pₜqₜ)/Σ(p₀q₀)"],"correct":0,"why":"Laspeyres delle quantità usa prezzi del periodo iniziale in entrambi i termini."},{"id":"c2-13","chapter":2,"q":"Un bene aumenta di prezzo del 10% e successivamente diminuisce del 10%. Il prezzo finale rispetto a quello iniziale:","options":["resta invariato","aumenta dell’1%","diminuisce dell’1%","diminuisce del 10%"],"correct":2,"why":"1,10×0,90=0,99: la diminuzione del 10% è applicata al prezzo già aumentato."},{"id":"c2-14","chapter":2,"q":"Se l’indice di valore è 1,15 e quello di volume è 1,05, quale formula ricava l’indice implicito dei prezzi?","options":["1,15/1,05","1,15+1,05","1,15×1,05","1,05/1,15"],"correct":0,"why":"Nella scomposizione valore = prezzo × quantità; l’indice di prezzo si ricava come valore/quantità."},{"id":"c3-01","chapter":3,"q":"Quale indice Istat è normalmente impiegato per misurare l’inflazione italiana riferita all’intera collettività?","options":["FOI senza tabacchi","NIC con tabacchi","Indice della produzione industriale"],"correct":1,"why":"Il NIC per l’intera collettività con tabacchi è la misura utilizzata per l’inflazione nazionale."},{"id":"c3-02","chapter":3,"q":"Quale indice è impiegato per l’adeguamento dei canoni di locazione secondo la dispensa?","options":["NIC con tabacchi","IPCA europeo","FOI senza tabacchi","PIL concatenato"],"correct":2,"why":"Per le rivalutazioni monetarie si utilizza il FOI al netto dei tabacchi."},{"id":"c3-03","chapter":3,"q":"Qual è la finalità distintiva dell’IPCA?","options":["Misurare direttamente il livello assoluto dei prezzi fra Stati","Garantire confrontabilità europea dell’andamento dei prezzi al consumo","Misurare il numero di occupati","Valutare soltanto il prezzo del petrolio"],"correct":1,"why":"L’indice armonizzato serve a confrontare la dinamica dei prezzi fra paesi europei mediante criteri metodologici comuni."},{"id":"c3-04","chapter":3,"q":"L’IPCA vale 105 in un paese e 110 in un altro, entrambi con base 2015=100. È possibile stabilire dove i prezzi siano in assoluto più elevati?","options":["Sì, nel secondo paese","Sì, nel primo paese","No: gli indici temporali non identificano i livelli assoluti confrontabili","No, perché i due numeri sommano a più di 200"],"correct":2,"why":"Una base temporale comune non equivale a un confronto dei livelli assoluti dei prezzi al consumo tra economie."},{"id":"c3-05","chapter":3,"q":"Il NIC vale 106 ad aprile e 107 a maggio dello stesso anno. Quale formula calcola l’inflazione congiunturale di maggio?","options":["(107/106−1)×100","(106/107−1)×100","(107−106)×100"],"correct":0,"why":"La variazione congiunturale confronta maggio con aprile, il mese immediatamente precedente."},{"id":"c3-06","chapter":3,"q":"L’indice è 102 a marzo 2024 e 105 a marzo 2025. Quale formula dà l’inflazione tendenziale di marzo 2025?","options":["(105/102−1)×100","(105/104−1)×100","(105−102)×100","(102/105−1)×100"],"correct":0,"why":"Il confronto tendenziale è con lo stesso mese dell’anno precedente."},{"id":"c3-07","chapter":3,"q":"Il NIC generale cresce del 2,2%, mentre quello di fondo cresce dell’1,3%. Le componenti escluse dalla core inflation:","options":["hanno contribuito a sostenere l’inflazione complessiva","hanno certamente avuto variazione nulla","hanno necessariamente contenuto l’inflazione","sono esattamente cresciute dello 0,9%"],"correct":0,"why":"L’indice generale supera quello di fondo: le componenti più volatili hanno avuto un effetto di sostegno della variazione generale."},{"id":"c3-08","chapter":3,"q":"Dal calcolo dell’inflazione di fondo si escludono:","options":["solo i beni alimentari lavorati","tutti i servizi","energia e alimentari non lavorati","abitazioni e trasporti in ogni caso"],"correct":2,"why":"La core inflation, nella definizione della dispensa, esclude gli energetici e gli alimentari non lavorati."},{"id":"c3-09","chapter":3,"q":"Il NIC medio annuo passa da 102 a 105. Quale formula calcola l’inflazione media annua?","options":["(105/102−1)×100","(105−102)×100","(102/105−1)×100"],"correct":0,"why":"L’inflazione media annua confronta le medie degli indici di due anni consecutivi."},{"id":"c3-10","chapter":3,"q":"La media del NIC dell’anno scorso è 100. Nell’anno corrente l’indice è 102 da gennaio a settembre, 104 a ottobre; si assume che resti 104 fino a dicembre. Quale formula dà l’inflazione acquisita a ottobre?","options":["{[(9×102+3×104)/12]/100−1}×100","(104/102−1)×100","(104/100−1)×100","{[(10×102+2×104)/12]/100−1}×100"],"correct":0,"why":"Si usano i nove mesi a 102 e ottobre–dicembre a 104, quindi tre mesi al livello attuale."},{"id":"c3-11","chapter":3,"q":"Il NIC medio dell’anno passato è 101 e l’indice a dicembre era 104. Quale formula calcola l’inflazione ereditata per l’anno successivo?","options":["(104/101−1)×100","(101/104−1)×100","(104−101)×100","(104/100−1)×100"],"correct":0,"why":"L’inflazione ereditata confronta il livello di dicembre con l’indice medio dell’anno che si chiude."},{"id":"c3-12","chapter":3,"q":"La media dell’indice dell’anno corrente è 108 e l’indice a dicembre dell’anno precedente era 105. Quale formula calcola l’inflazione propria?","options":["(108/105−1)×100","(105/108−1)×100","(108/100−1)×100","(108−105)×100"],"correct":0,"why":"La dinamica propria confronta la media corrente con il livello raggiunto a dicembre dell’anno precedente."},{"id":"c3-13","chapter":3,"q":"Un canone mensile è 800 €. Il FOI passa da 100 a 102; il contratto applica il 100% della variazione. Qual è il nuovo canone?","options":["816 €","802 €","800 €"],"correct":0,"why":"Il FOI aumenta del 2%, quindi 800×1,02=816 euro."},{"id":"c3-14","chapter":3,"q":"Un reddito nominale cresce del 5% e i prezzi del 5%. In termini di potere d’acquisto il reddito:","options":["cresce del 10%","rimane sostanzialmente invariato","diminuisce del 5%","aumenta del 5%"],"correct":1,"why":"I due fattori si compensano: 1,05/1,05=1."},{"id":"c3-15","chapter":3,"q":"L’IPCA e il NIC possono mostrare valori diversi anche perché:","options":["l’IPCA considera i prezzi effettivamente pagati, includendo riduzioni temporanee come i saldi","l’IPCA esclude sempre tutte le famiglie","il NIC misura solo i prezzi esteri","l’IPCA misura il PIL reale"],"correct":0,"why":"La dispensa sottolinea, tra le differenze metodologiche, il trattamento di promozioni, saldi e alcune imposte."},{"id":"c4-01","chapter":4,"q":"La quantità di merci presenti in magazzino al 31 dicembre è una variabile:","options":["di flusso","di stock","necessariamente stagionale","non quantitativa"],"correct":1,"why":"Uno stock è misurato in un particolare istante temporale."},{"id":"c4-02","chapter":4,"q":"Il numero di automobili prodotte nell’intero mese di settembre è una variabile:","options":["di stock","di flusso","non osservabile nel tempo"],"correct":1,"why":"Un flusso è riferito a un intervallo temporale di produzione o attività."},{"id":"c4-03","chapter":4,"q":"Una serie mostra ogni agosto un calo della produzione dovuto alle ferie. Quale componente emerge?","options":["Ciclica di lungo periodo","Stagionale","Accidentale per definizione","Trend crescente"],"correct":1,"why":"La ripetizione in uno stesso periodo degli anni successivi è tipica della stagionalità."},{"id":"c4-04","chapter":4,"q":"Una fase di recessione economica che dura più anni è soprattutto connessa alla componente:","options":["stagionale settimanale","ciclica","esclusivamente accidentale","di calendario"],"correct":1,"why":"Il ciclo economico riguarda oscillazioni pluriennali dell’attività produttiva."},{"id":"c4-05","chapter":4,"q":"Quale espressione descrive il modello additivo classico della serie storica?","options":["xₜ=Tₜ+Cₜ+Sₜ+aₜ","xₜ=Tₜ×Cₜ×Sₜ×aₜ","xₜ=Tₜ−Sₜ","xₜ=Tₜ/Cₜ"],"correct":0,"why":"Il modello additivo somma trend, ciclo, stagionalità e componente accidentale."},{"id":"c4-06","chapter":4,"q":"In un mese l’impresa produce 500 unità in 20 giorni lavorativi. In un altro produce 550 unità in 22 giorni. La produzione giornaliera:","options":["è diminuita","è cresciuta del 10%","è invariata"],"correct":2,"why":"500/20=25 unità al giorno; 550/22=25. La differenza totale dipende dai giorni lavorativi."},{"id":"c4-07","chapter":4,"q":"Per confrontare correttamente due mesi consecutivi di produzione industriale con stagionalità e calendario irregolare servono:","options":["solo la deflazione","correzione degli effetti di calendario e destagionalizzazione","solo la correzione del numero dei residenti","nessuna trasformazione"],"correct":1,"why":"Il calendario rimuove l’effetto dei giorni lavorativi, la destagionalizzazione la regolarità stagionale."},{"id":"c4-08","chapter":4,"q":"Una serie ha valori x₁=8, x₂=10, x₃=15, x₄=17. Quale formula esprime la media mobile centrata a tre termini in t=2?","options":["(8+10+15)/3","(10+15+17)/3","(8+10)/2","(8+10+15+17)/4"],"correct":0,"why":"La media centrata a tre termini comprende il valore precedente, quello centrale e il successivo."},{"id":"c4-09","chapter":4,"q":"Per una serie mensile con stagionalità annuale, quale ordine di media mobile è tipicamente usato per attenuarla?","options":["3","6","12","24 necessariamente"],"correct":2,"why":"Una stagionalità annuale su dati mensili ha periodo 12; la media mobile deve avere ordine 12."},{"id":"c4-10","chapter":4,"q":"Perché una media mobile centrata a tre termini non può essere calcolata al primo istante della serie senza ulteriori informazioni?","options":["Manca il valore precedente","Non conosciamo il numero dei residenti","La media sarebbe sempre negativa"],"correct":0,"why":"La media centrata richiede xₜ₋₁ e xₜ₊₁ oltre al valore centrale."},{"id":"c4-11","chapter":4,"q":"Quale proprietà possiede in generale una media mobile con ordine più alto?","options":["Amplifica necessariamente ogni oscillazione","Produce di norma un maggiore lisciamento","È equivalente alla serie grezza","Rimuove necessariamente il trend"],"correct":1,"why":"Usare più termini attenua più intensamente le fluttuazioni veloci, con un possibile maggiore smussamento delle variazioni reali."},{"id":"c4-12","chapter":4,"q":"Una media mobile semplice con 4 termini, se si vuole attribuire il risultato a un singolo tempo, richiede:","options":["il centraggio di due medie consecutive","l’eliminazione di tutti i valori pari","la moltiplicazione per 4 della serie","un indice FOI"],"correct":0,"why":"Le medie di ordine pari risultano tra due periodi: si mediano due medie consecutive per centrarle."},{"id":"c5-01","chapter":5,"q":"L’indice della produzione industriale (IPI) misura principalmente le variazioni:","options":["del valore del PIL nominale","del volume fisico della produzione industriale","dei soli prezzi alla produzione","del numero di famiglie"],"correct":1,"why":"L’IPI segue la quantità/volume dell’attività produttiva, non il semplice fatturato nominale."},{"id":"c5-02","chapter":5,"q":"Quale settore è escluso dall’industria in senso stretto cui si riferisce l’IPI?","options":["Attività manifatturiere","Produzione di energia","Costruzioni"],"correct":2,"why":"Nella definizione della dispensa, l’indice della produzione industriale esclude le costruzioni."},{"id":"c5-03","chapter":5,"q":"Quale numero indice è utilizzato per l’IPI nella metodologia descritta dalla dispensa?","options":["Indice a catena di Laspeyres","Indice semplice dei salari","Indice di Gini","Indice FOI"],"correct":0,"why":"Si ricorre a un indice di quantità a catena di Laspeyres."},{"id":"c5-04","chapter":5,"q":"L’aggiornamento annuale del paniere e dei pesi nell’IPI serve principalmente a:","options":["evitare qualsiasi revisione delle stime","rispecchiare l’evoluzione della struttura produttiva","eliminare tutti i consumi intermedi","trasformare l’indice in un deflatore"],"correct":1,"why":"La struttura produttiva e il contributo dei diversi settori cambiano: i pesi aggiornati aiutano a misurarli meglio."},{"id":"c5-05","chapter":5,"q":"Perché l’IPI utilizza anche proxy invece di misurare direttamente il valore aggiunto reale mensile?","options":["Il valore aggiunto reale non è stimabile abbastanza tempestivamente ogni mese","I prezzi industriali sono sempre costanti","Le imprese non hanno mai dati sulle ore lavorate","Il valore aggiunto coincide per definizione con la spesa delle famiglie"],"correct":0,"why":"Informazioni rapide su quantità, produzione deflazionata e ore lavorate vengono impiegate come proxy."},{"id":"c5-06","chapter":5,"q":"Una proxy della produzione considerata nella dispensa è:","options":["il tasso di natalità","le ore lavorate corrette per la produttività","l’indice di vecchiaia"],"correct":1,"why":"Le ore lavorate, corrette tenendo conto della produttività, possono approssimare il volume della produzione."},{"id":"c5-07","chapter":5,"q":"Il concatenato di dicembre vale 108; l’indice del mese corrente rispetto a dicembre è 1,05. Qual è l’espressione corretta del nuovo valore concatenato?","options":["108+1,05","108×1,05","108/1,05","1,05/108"],"correct":1,"why":"La formula ricorsiva di concatenamento moltiplica il precedente indice concatenato per l’indice relativo successivo."},{"id":"c5-08","chapter":5,"q":"Per misurare la variazione congiunturale dell’IPI è preferibile usare la serie:","options":["grezza non corretta","destagionalizzata","di Gini","a prezzi di mercato senza altre correzioni"],"correct":1,"why":"Il confronto fra periodi consecutivi richiede che le oscillazioni stagionali siano rimosse."},{"id":"c5-09","chapter":5,"q":"Per confrontare agosto di un anno con agosto dell’anno precedente si utilizza tipicamente l’IPI:","options":["corretto per gli effetti di calendario","unicamente grezzo","FOI senza tabacchi","dei valori nominali delle vendite"],"correct":0,"why":"Nei confronti tendenziali la correzione del numero e della disposizione dei giorni lavorativi migliora la confrontabilità."},{"id":"c5-10","chapter":5,"q":"I valori più recenti dell’IPI pubblicati dall’Istat:","options":["non possono mai cambiare","possono essere revisionati quando arrivano nuove informazioni","sono sempre definitivi prima della rilevazione"],"correct":1,"why":"I dati mensili provvisori possono essere rivisti a seguito dell’acquisizione di ulteriori informazioni."},{"id":"c5-11","chapter":5,"q":"Due imprese producono le stesse quantità, ma il prezzo unitario di una raddoppia. L’IPI dovrebbe:","options":["raddoppiare necessariamente","aumentare soltanto per effetto dei prezzi","non modificarsi per questo solo cambiamento di prezzo","diventare negativo"],"correct":2,"why":"Un indice del volume fisico non deve registrare crescita reale se varia soltanto il livello dei prezzi."},{"id":"c6-01","chapter":6,"q":"Qual è la differenza concettuale tra PIL e Reddito nazionale lordo (RNL)?","options":["Il PIL considera l’attività produttiva interna; l’RNL tiene conto dei redditi dei residenti dall’estero e verso l’estero","Il PIL include solo salari","L’RNL considera soltanto importazioni","Non esiste differenza"],"correct":0,"why":"L’aggregato nazionale considera i redditi primari netti con l’estero; quello interno la produzione sul territorio economico."},{"id":"c6-02","chapter":6,"q":"Con PIL=1.000, redditi dei residenti dall’estero=70 e redditi pagati a non residenti=40, quale formula dà l’RNL?","options":["1.000+70+40","1.000−70+40","1.000+70−40","1.000−70−40"],"correct":2,"why":"Il RNL si ottiene aggiungendo i redditi ricevuti dall’estero e sottraendo quelli versati a non residenti."},{"id":"c6-03","chapter":6,"q":"La differenza tra un aggregato lordo e quello netto corrispondente è costituita principalmente da:","options":["esportazioni","ammortamenti","imposte sul reddito sempre"],"correct":1,"why":"Il saldo netto si ottiene sottraendo il consumo di capitale fisso (ammortamenti) dall’aggregato lordo."},{"id":"c6-04","chapter":6,"q":"Il valore della produzione è 650 e i consumi intermedi sono 420. Il valore aggiunto è:","options":["230","1.070","420","650"],"correct":0,"why":"Valore aggiunto = valore della produzione − consumi intermedi = 230."},{"id":"c6-05","chapter":6,"q":"PIL ai prezzi di mercato si ricava dal valore aggiunto ai prezzi base:","options":["sottraendo imposte e aggiungendo contributi","aggiungendo imposte sui prodotti e sottraendo contributi sui prodotti","sommando soltanto esportazioni","sottraendo i consumi finali"],"correct":1,"why":"La conversione ai prezzi di mercato aggiunge imposte nette sui prodotti al valore aggiunto ai prezzi base."},{"id":"c6-06","chapter":6,"q":"Il conto delle risorse e degli impieghi utilizza l’identità:","options":["PIL+M=C+I+ΔS+X","PIL=X−M soltanto","PIL=M−X−C","PIL=C−I−X"],"correct":0,"why":"Le risorse comprendono PIL e importazioni; gli impieghi consumi, investimenti, scorte ed esportazioni."},{"id":"c6-07","chapter":6,"q":"C=800, I=250, ΔS=−20, X=160 e M=190. Quale espressione calcola il PIL?","options":["800+250−20+160−190","800+250+20+160+190","800+250−20−160+190"],"correct":0,"why":"Per gli impieghi PIL=C+I+ΔS+X−M. Le importazioni si sottraggono."},{"id":"c6-08","chapter":6,"q":"La stima del PIL include, secondo la dispensa:","options":["solo le imprese registrate fiscalmente","anche attività del sommerso e alcune attività illegali con scambi volontari","qualsiasi provento da attività coercitive senza distinzione","solo il lavoro dipendente"],"correct":1,"why":"L’esaustività richiede di considerare componenti dell’economia non osservata secondo le regole della contabilità nazionale."},{"id":"c6-09","chapter":6,"q":"Il PIL nominale aumenta del 10%, ma quello reale del 4%. Quale espressione calcola la variazione implicita dei prezzi?","options":["(1,10/1,04−1)×100","(1,10−1,04)×100 esattamente","(1,10×1,04−1)×100","(1,04/1,10−1)×100"],"correct":0,"why":"L’indice dei prezzi implicito si ricava dal rapporto tra indice di valore nominale e indice di volume reale."},{"id":"c6-10","chapter":6,"q":"Qual è la formula per ottenere il deflatore del PIL nell’anno t (base 100)?","options":["PIL reale/PIL nominale×100","PIL nominale/PIL reale×100","PIL nominale−PIL reale","PIL nominale+PIL reale"],"correct":1,"why":"Il deflatore implicito è il rapporto tra PIL a prezzi correnti e PIL a valori concatenati, moltiplicato per 100."},{"id":"c6-11","chapter":6,"q":"PIL nominale 2019=1.800, PIL concatenato 2019=1.700; PIL nominale 2020=1.850, PIL concatenato 2020=1.690. Quale formula dà la variazione del deflatore nel 2020?","options":["[(1850/1690)/(1800/1700)−1]×100","[(1850/1800)−1]×100","[(1690/1700)−1]×100"],"correct":0,"why":"Si calcolano i deflatori nei due anni e si confrontano: (D₂₀₂₀/D₂₀₁₉−1)×100."},{"id":"c6-12","chapter":6,"q":"Qual è un limite dei valori concatenati nella contabilità nazionale?","options":["Non misurano le variazioni reali","Non sono in generale additivi nelle singole componenti","Rendono impossibile ogni confronto temporale","Richiedono prezzi invariati per decenni"],"correct":1,"why":"In generale, sommando i valori concatenati delle componenti non si ricava esattamente il valore concatenato del totale."},{"id":"c6-13","chapter":6,"q":"L’indice di quantità di Laspeyres tra t−1 e t è:","options":["Σ(pₜ₋₁qₜ)/Σ(pₜ₋₁qₜ₋₁)","Σ(pₜqₜ)/Σ(pₜ₋₁qₜ)","Σ(pₜqₜ)/Σ(pₜ₋₁qₜ₋₁)","Σ(pₜ₋₁qₜ₋₁)/Σ(pₜ₋₁qₜ)"],"correct":0,"why":"Le quantità cambiano, ma i prezzi sono fissati al periodo precedente per isolare la variazione reale."},{"id":"c6-14","chapter":6,"q":"Un’impresa acquista un macchinario che userà per più anni nella produzione. L’operazione rientra principalmente tra:","options":["consumi finali della famiglia","investimenti fissi lordi","importazioni necessariamente","variazione dell’indice di Gini"],"correct":1,"why":"I beni capitali destinati all’attività produttiva per più periodi rientrano negli investimenti fissi lordi."},{"id":"c6-15","chapter":6,"q":"Nel passaggio da valore dei beni a prezzi correnti a quello a prezzi costanti si intende eliminare:","options":["le quantità prodotte","l’effetto delle variazioni dei prezzi","la classificazione delle imprese"],"correct":1,"why":"La valutazione in termini reali isola le quantità tenendo sotto controllo la componente dei prezzi."},{"id":"c7-01","chapter":7,"q":"Nella rilevazione delle forze di lavoro Istat, l’unità di rilevazione e quella di analisi sono rispettivamente:","options":["individuo e impresa","famiglia e individuo","impresa e famiglia","comune e comune"],"correct":1,"why":"Le famiglie vengono contattate per raccogliere informazioni riferite ai singoli componenti."},{"id":"c7-02","chapter":7,"q":"Il sistema 2-2-2 della rilevazione delle forze di lavoro significa che una famiglia:","options":["viene intervistata per due trimestri, esclusa per due, intervistata ancora per due","viene intervistata ogni giorno","è sostituita ogni due settimane","è sempre intervistata solo due volte"],"correct":0,"why":"La famiglia partecipa per 2 trimestri, si ferma per 2 e torna per altri 2 trimestri."},{"id":"c7-03","chapter":7,"q":"Una persona di 28 anni non lavora, cerca attivamente impiego ed è disponibile a iniziare entro due settimane. Come viene classificata?","options":["Inattiva","Occupata","Disoccupata","Non residente necessariamente"],"correct":2,"why":"L’assenza di lavoro, la ricerca attiva e la disponibilità individuano la condizione di disoccupato."},{"id":"c7-04","chapter":7,"q":"Una persona non lavora e non cerca lavoro; non ha un impiego già trovato da iniziare. In genere è:","options":["disoccupata automaticamente","inattiva","occupata"],"correct":1,"why":"Non basta non lavorare: per essere disoccupati bisogna rispettare i criteri di ricerca e disponibilità."},{"id":"c7-05","chapter":7,"q":"In una fascia d’età le forze di lavoro sono 30.000, di cui 27.000 occupati. Il tasso di disoccupazione è:","options":["3%","10%","90%","30%"],"correct":1,"why":"I disoccupati sono 3.000; 3.000/30.000=10%."},{"id":"c7-06","chapter":7,"q":"Per calcolare correttamente il tasso di occupazione 15–64 anni, il denominatore è:","options":["tutte le forze di lavoro di ogni età","la popolazione residente di 15–64 anni","i disoccupati di 15–64 anni","la popolazione italiana di ogni età"],"correct":1,"why":"La fascia d’età del denominatore deve coincidere con quella dell’indicatore occupazionale."},{"id":"c7-07","chapter":7,"q":"La popolazione di 15–64 anni è 50.000 e le forze di lavoro nella stessa fascia sono 35.000. Il tasso di inattività è:","options":["70%","35%","15%","30%"],"correct":3,"why":"Gli inattivi sono 15.000 e 15.000/50.000=30%."},{"id":"c7-08","chapter":7,"q":"Il tasso di attività è:","options":["occupati/disoccupati","forze di lavoro/popolazione di riferimento","disoccupati/popolazione di riferimento"],"correct":1,"why":"La partecipazione al mercato del lavoro si misura con (occupati+disoccupati)/popolazione pertinente."},{"id":"c7-09","chapter":7,"q":"La stima di una media è 2.500 e il suo errore relativo è 0,02. Qual è l’espressione dell’errore standard?","options":["2.500/0,02","2.500×0,02","2.500+0,02","0,02/2.500"],"correct":1,"why":"CV = SE/stima, quindi SE = stima×CV."},{"id":"c7-10","chapter":7,"q":"Una stima vale 800 e il suo errore standard è 20. Qual è l’intervallo di confidenza al 95% con z=1,96?","options":["[800−1,96×20; 800+1,96×20]","[800−20; 800+20]","[800−1,96×800; 800+1,96×800]","[20−1,96×800; 20+1,96×800]"],"correct":0,"why":"L’intervallo è stima ± 1,96×errore standard."},{"id":"c7-11","chapter":7,"q":"Una stima di 1.000 ha SE=10 e una stima di 100 ha SE=5. Quale è relativamente più precisa?","options":["La prima, perché CV=1% contro 5%","La seconda, perché SE è numericamente più piccolo","Hanno la stessa precisione","Non sono confrontabili in termini relativi"],"correct":0,"why":"Il coefficiente di variazione rapporta l’errore standard alla stima: 10/1000=1%, 5/100=5%."},{"id":"c7-14","chapter":7,"q":"Un errore standard più alto in una piccola ripartizione geografica rispetto al totale nazionale può dipendere da:","options":["campione generalmente meno numeroso","reddito medio sicuramente più alto","errore di calcolo inevitabile","disuguaglianza necessariamente maggiore"],"correct":0,"why":"Una minore numerosità campionaria può comportare, a parità di altre condizioni, maggiore variabilità di stima."},{"id":"c8-01","chapter":8,"q":"Per quale delle seguenti variabili la concentrazione di Gini non ha l’interpretazione usuale della dispensa?","options":["Fatturato delle imprese","Reddito familiare","Età delle persone","Superficie agricola detenuta"],"correct":2,"why":"L’età non è trasferibile da un individuo a un altro; la concentrazione riguarda caratteri quantitativi trasferibili."},{"id":"c8-02","chapter":8,"q":"Quale distribuzione di reddito tra quattro persone rappresenta l’equidistribuzione?","options":["10,10,10,10","0,0,0,40","2,8,10,20"],"correct":0,"why":"Nell’equidistribuzione tutti hanno lo stesso ammontare della variabile."},{"id":"c8-03","chapter":8,"q":"Quale distribuzione rappresenta la concentrazione massima tra quattro unità con totale 40?","options":["10,10,10,10","0,0,0,40","5,5,10,20","4,8,12,16"],"correct":1,"why":"La concentrazione massima si verifica quando una unità possiede tutto il totale e le altre nulla."},{"id":"c8-04","chapter":8,"q":"I redditi ordinati sono 5,15,30,50. Quanto vale la quota cumulata q₂?","options":["0,20","0,50","0,25","0,05"],"correct":0,"why":"Le prime due persone hanno 5+15=20 su un reddito totale di 100, quindi q₂=0,20."},{"id":"c8-05","chapter":8,"q":"Con n=5 unità ordinate, quale formula dà la quota cumulata della popolazione delle prime 3?","options":["5/3","3/5","(x₁+x₂+x₃)/A","3×5"],"correct":1,"why":"pᵢ=i/n; la quota relativa alle prime tre unità è 3/5."},{"id":"c8-06","chapter":8,"q":"Quale affermazione descrive correttamente la curva di Lorenz?","options":["Sull’asse x ci sono quote cumulate di popolazione e sull’asse y quote cumulate del carattere","Sull’asse x ci sono solo i prezzi","È sempre sopra la diagonale di equidistribuzione"],"correct":0,"why":"La curva connette quote cumulate di popolazione ordinate dal più povero con le corrispondenti quote cumulate di reddito."},{"id":"c8-07","chapter":8,"q":"Quando la curva di Lorenz coincide con la diagonale, l’indice di concentrazione è:","options":["1","0","0,5 necessariamente","non definito sempre"],"correct":1,"why":"La diagonale indica equidistribuzione e quindi Gini nullo."},{"id":"c8-08","chapter":8,"q":"Quale formula rappresenta il Gini esatto normalizzato della dispensa per n osservazioni ordinate?","options":["R=1−[2/(n−1)]Σᵢ₌₁ⁿ⁻¹qᵢ","R=Σᵢxᵢ/n","R=Σᵢpᵢ+qᵢ","R=1−Σᵢxᵢ"],"correct":0,"why":"La formula semplificata normalizzata usa la somma delle quote cumulative qᵢ per i primi n−1 individui."},{"id":"c8-09","chapter":8,"q":"Quattro redditi sono 10,10,20,60 (totale 100). Quale formula calcola il Gini normalizzato?","options":["1−(2/3)×(0,10+0,20+0,40)","1−(0,10+0,20+0,40)","(0,10+0,20+0,40)/4","(10+10+20+60)/4"],"correct":0,"why":"Con n=4, si applica 1−2/(4−1)×somma delle prime tre quote cumulative."},{"id":"c8-10","chapter":8,"q":"Se tutti i redditi vengono moltiplicati per 3, l’indice di Gini:","options":["triplica","rimane invariato","diminuisce a un terzo"],"correct":1,"why":"Gini è invariante a trasformazioni di scala positive: le quote di reddito restano uguali."},{"id":"c8-11","chapter":8,"q":"Se si aggiunge la stessa somma positiva a tutti i redditi non negativi e non tutti uguali, Gini in generale:","options":["aumenta","rimane invariato","diminuisce","diventa negativo"],"correct":2,"why":"L’aggiunta uguale per tutti riduce gli scarti in termini relativi e quindi la concentrazione."},{"id":"c8-12","chapter":8,"q":"Nel paese A S80/S20=7, nel paese B vale 4. Quale presenta maggiore disuguaglianza tra quinto superiore e inferiore?","options":["Paese B","Paese A","Entrambi uguali","Non si può interpretare alcun rapporto"],"correct":1,"why":"Un valore più alto indica che il reddito del 20% più ricco è più grande rispetto a quello del 20% più povero."},{"id":"c8-13","chapter":8,"q":"Le quote di reddito per quinti sono 6%, 12%, 18%, 25%, 39%. Come si calcola S80/S20?","options":["39/6","6/39","39−6","(39+25)/(6+12)"],"correct":0,"why":"S80/S20 è il rapporto tra la quota complessiva dell’ultimo quinto e quella del primo."},{"id":"c8-14","chapter":8,"q":"I dati sono raggruppati per classi di reddito e non si conoscono gli importi individuali. Quale procedura approssima la concentrazione?","options":["Utilizzare valori centrali delle classi, frequenze e quote cumulate","Trattare tutte le osservazioni come identiche senza calcoli","Usare solo il reddito massimo"],"correct":0,"why":"I valori centrali permettono di approssimare gli ammontari di classe, poi si costruiscono pᵢ e qᵢ."},{"id":"c9-01","chapter":9,"q":"Quale istituzione svolge l’Indagine sui bilanci delle famiglie italiane richiamata nella dispensa?","options":["Banca d’Italia","Eurostat soltanto","Ministero dell’istruzione","Banca centrale europea soltanto"],"correct":0,"why":"L’indagine sui bilanci delle famiglie è svolta dalla Banca d’Italia e raccoglie redditi, ricchezze e consumi."},{"id":"c9-02","chapter":9,"q":"Quale strumento viene usato nell’indagine Istat sulla spesa per consumi per registrare acquisti ricorrenti di breve periodo?","options":["Diario delle spese","Indice di Gini","Bilancio dello Stato","Deflatore del PIL"],"correct":0,"why":"Il diario permette alle famiglie di registrare spese frequenti, affiancando le interviste."},{"id":"c9-03","chapter":9,"q":"Una distribuzione di reddito mostra media superiore alla mediana. Quale spiegazione è plausibile?","options":["Presenza di redditi elevati che trascinano la media verso l’alto","Tutti i redditi sono identici","La mediana è sempre maggiore della media","I redditi sono tutti negativi"],"correct":0,"why":"La distribuzione dei redditi è spesso asimmetrica a destra, influenzando la media più della mediana."},{"id":"c9-04","chapter":9,"q":"Famiglia con due adulti e un minore di 10 anni; reddito 36.000 €. Con la scala OCSE modificata, quale espressione dà il reddito equivalente?","options":["36.000/3","36.000/(1+0,5+0,3)","36.000×(1+0,5+0,3)"],"correct":1,"why":"I pesi sono 1 per il primo adulto, 0,5 per il secondo e 0,3 per il bambino sotto i 14 anni."},{"id":"c9-05","chapter":9,"q":"L’incidenza della povertà relativa è il 12%. Che cosa significa?","options":["Il reddito dei poveri è il 12% della soglia","Il 12% delle famiglie di riferimento è classificato come povero","La soglia è aumentata del 12%","La spesa totale è diminuita del 12%"],"correct":1,"why":"L’incidenza è la quota di famiglie povere sul totale, non la profondità del divario dalla soglia."},{"id":"c9-06","chapter":9,"q":"La linea di povertà è 1.000 e il consumo medio dei poveri è 750. Quanto vale l’intensità?","options":["25%","75%","10%","250%"],"correct":0,"why":"I=(1.000−750)/1.000=25%."},{"id":"c9-07","chapter":9,"q":"Soglia di povertà relativa z=1.200, intensità I=0,20. Quale espressione dà il consumo medio equivalente dei poveri?","options":["1.200×(1−0,20)","1.200/0,20","1.200×(1+0,20)","1.200−0,20"],"correct":0,"why":"Dalla formula I=(z−ȳ)/z si ricava ȳ=z(1−I)."},{"id":"c9-08","chapter":9,"q":"Nella metodologia di povertà relativa Istat della dispensa, la soglia per una famiglia di due componenti è:","options":["metà del reddito massimo nazionale","spesa media mensile pro capite per consumi","il prezzo del paniere energetico"],"correct":1,"why":"La soglia Istat per due componenti è ancorata alla spesa media mensile pro capite nazionale."},{"id":"c9-09","chapter":9,"q":"Nell’indagine della Banca d’Italia descritta nella dispensa, la soglia di povertà relativa basata sul reddito equivalente è:","options":["50% della mediana dei redditi equivalenti","60% della media dei prezzi","un valore fisso uguale per tutti i paesi","100% del reddito medio nazionale"],"correct":0,"why":"La soglia Banca d’Italia citata dalla dispensa è pari a metà della mediana della distribuzione equivalente."},{"id":"c9-10","chapter":9,"q":"Nel sistema EU-SILC descritto nella dispensa, è a rischio di povertà chi ha reddito equivalente inferiore al:","options":["10% della media","50% del massimo","60% della mediana","100% della mediana"],"correct":2,"why":"L’indicatore europeo di rischio di povertà usa il 60% della mediana nazionale del reddito disponibile equivalente."},{"id":"c9-11","chapter":9,"q":"La povertà assoluta viene definita in relazione:","options":["esclusivamente al quinto più ricco","a un paniere minimo di beni e servizi essenziali","unicamente alla mediana del PIL","all’indice FOI soltanto"],"correct":1,"why":"La soglia rappresenta la spesa minima per un insieme di beni e servizi essenziali; varia per famiglia e territorio."},{"id":"c9-12","chapter":9,"q":"L’indicatore S80/S20 confronta:","options":["la quota di reddito del 20% più ricco con quella del 20% più povero","il prezzo del bene 80 con il prezzo del bene 20","due medie mensili consecutive"],"correct":0,"why":"Il rapporto interquintilico mette a confronto i due estremi della distribuzione."},{"id":"c9-13","chapter":9,"q":"Per la definizione storica di grave deprivazione materiale riportata nella dispensa, è necessario non potersi permettere per ragioni economiche almeno:","options":["uno su nove elementi","quattro su nove elementi","tutti e nove gli elementi","unicamente l’automobile"],"correct":1,"why":"L’indicatore descritto nel materiale di studio si basa sull’assenza per motivi economici di almeno quattro su nove condizioni."},{"id":"arc-004","chapter":7,"q":"L'errore standard di uno stimatore non distorto rappresenta:","options":["Una stima della deviazione standard dello stimatore","Una quantità definibile solo per stimatori efficienti","Una quantità sempre pari a zero"],"correct":0,"why":"L’errore standard stima la deviazione standard della distribuzione dello stimatore.","source":"QUIZ STATISTICA.pdf · p. 1","sourceType":"archived","adapted":false},{"id":"arc-013","chapter":7,"q":"Uno stimatore di θ è corretto (non distorto) se:","options":["Ha sempre una varianza piccola","Restituisce il valore vero in ogni campione","Il suo valore atteso coincide con θ"],"correct":2,"why":"Per definizione E(T) = θ: la non distorsione riguarda il valore atteso, non il singolo campione.","source":"QUIZ STATISTICA.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-015","chapter":7,"q":"A parità di stima e di errore standard, aumentando il livello di confidenza dal 95% al 99%, l’intervallo:","options":["Rimane invariato","Diventa più stretto","Diventa più ampio"],"correct":2,"why":"Un livello di confidenza maggiore richiede un valore critico più grande e quindi un margine di errore maggiore.","source":"QUIZ STATISTICA.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-017","chapter":2,"q":"Il numero indice del prezzo di un prodotto vale 120 nella città X e 125 nella città Y, rispetto alla stessa data base. In quale città il livello del prezzo corrente è più basso?","options":["Nella città X","Non abbiamo informazioni sufficienti sui livelli di prezzo iniziali","I livelli sono necessariamente uguali"],"correct":1,"why":"Un indice temporale segnala l’evoluzione relativa, non il prezzo assoluto nei due luoghi.","source":"QUIZ STATISTICA.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-018","chapter":2,"q":"Le variazioni relative del fatturato negli ultimi tre mesi sono −0,01, −0,01 e −0,01. Che cosa si osserva?","options":["Il fatturato è stabile","Il fatturato diminuisce con tasso mensile costante","Non possiamo dire nulla sulla sua dinamica"],"correct":1,"why":"Ogni mese il fatturato diminuisce dell’1% rispetto al mese precedente: il tasso è costante e negativo.","source":"QUIZ STATISTICA.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-019","chapter":7,"q":"Ad agosto 2021, per gli individui 35–49 anni, i disoccupati sono il 7,8% delle forze di lavoro e il 6,2% della popolazione. Quanto vale il tasso di disoccupazione?","options":["Non è univocamente determinabile","7,8%","6,2%"],"correct":1,"why":"Il tasso di disoccupazione ha per denominatore le forze di lavoro, quindi il valore pertinente è 7,8%.","source":"QUIZ STATISTICA.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-020","chapter":2,"q":"In un mercato con prezzi in euro, in quale unità si esprime la variazione assoluta del prezzo tra due tempi?","options":["Euro","Nessuna unità di misura","1/euro"],"correct":0,"why":"La differenza pₜ − p₀ conserva l’unità di misura originaria del prezzo.","source":"QUIZ STATISTICA.pdf · p. 3","sourceType":"archived","adapted":false},{"id":"arc-021","chapter":2,"q":"Un rapporto statistico è pari al 40%. Come va letto?","options":["Il numeratore è diminuito del 60%","Posto il denominatore pari a 100, il numeratore vale 40","Posto il numeratore pari a 100, il denominatore vale 40"],"correct":1,"why":"Il rapporto 0,40 significa 40 unità del numeratore per 100 unità del denominatore.","source":"QUIZ STATISTICA.pdf · p. 3","sourceType":"archived","adapted":false},{"id":"arc-022","chapter":2,"q":"Un rapporto statistico vale il 60%. Quale interpretazione è corretta?","options":["Posto il numeratore pari a 100, il denominatore è 60","Il numeratore è diminuito del 40%","Posto il denominatore pari a 100, il numeratore è 60"],"correct":2,"why":"Il 60% equivale al rapporto 60/100, senza implicare una variazione nel tempo.","source":"QUIZ STATISTICA.pdf · p. 3","sourceType":"archived","adapted":false},{"id":"arc-023","chapter":2,"q":"Le variazioni del fatturato negli ultimi tre mesi sono −1%, −2% e −3%. Quale affermazione è corretta?","options":["Il fatturato diminuisce in tutti i mesi considerati","Il fatturato cresce","Le variazioni non permettono di osservare la dinamica"],"correct":0,"why":"Tutti i tassi sono negativi e quindi il fatturato diminuisce mese dopo mese.","source":"QUIZ STATISTICA.pdf · p. 3","sourceType":"archived","adapted":false},{"id":"arc-024","chapter":7,"q":"A settembre 2020, per la fascia 35–49 anni, i disoccupati rappresentano il 7,9% delle forze di lavoro e il 6,3% della popolazione. Quanto è il tasso di disoccupazione?","options":["Non è definibile","7,9%","6,3%"],"correct":1,"why":"Il tasso di disoccupazione confronta disoccupati e forze di lavoro: 7,9%.","source":"QUIZ STATISTICA.pdf · p. 3","sourceType":"archived","adapted":false},{"id":"arc-025","chapter":7,"q":"A settembre 2020, tra i 25–34enni, i disoccupati sono il 15,4% delle forze di lavoro e il 10,9% della popolazione. Quanto vale il tasso di disoccupazione?","options":["Non è definibile","10,9%","15,4%"],"correct":2,"why":"Il valore corretto è la quota dei disoccupati sulle forze di lavoro, non sulla popolazione.","source":"QUIZ STATISTICA.pdf · p. 3","sourceType":"archived","adapted":false},{"id":"arc-026","chapter":2,"q":"Qual è l’unità di misura di un indice semplice di prezzo a base mobile?","options":["Nessuna: è un numero puro","Euro","1/euro"],"correct":0,"why":"L’indice è il rapporto fra due prezzi nella stessa unità di misura, che si semplifica.","source":"QUIZ STATISTICA.pdf · p. 3","sourceType":"archived","adapted":false},{"id":"arc-027","chapter":7,"q":"Ad agosto 2020, per la fascia 15–24 anni, il 32,1% delle forze di lavoro è disoccupato e l’8,0% della popolazione è disoccupato. Qual è il tasso di disoccupazione?","options":["Non è determinabile","32,1%","8,0%"],"correct":1,"why":"Il denominatore del tasso di disoccupazione sono le forze di lavoro della stessa fascia d’età.","source":"QUIZ STATISTICA.pdf · p. 3","sourceType":"archived","adapted":false},{"id":"arc-028","chapter":2,"q":"Qual è l’unità di misura di un numero indice semplice di prezzo a base fissa?","options":["Nessuna","1/euro","Euro"],"correct":0,"why":"Anche l’indice a base fissa rapporta prezzi omogenei, eliminando la dimensione fisica.","source":"QUIZ STATISTICA.pdf · p. 4","sourceType":"archived","adapted":false},{"id":"arc-029","chapter":2,"q":"Le variazioni relative mensili del fatturato sono +3%, +2% e +1%. Qual è la dinamica del fatturato?","options":["Diminuisce","Cresce nei tre mesi, ma con tassi via via inferiori","Non possiamo determinarla"],"correct":1,"why":"Tutti i tassi sono positivi: il fatturato cresce, pur rallentando.","source":"QUIZ STATISTICA.pdf · p. 4","sourceType":"archived","adapted":false},{"id":"arc-030","chapter":2,"q":"Le variazioni relative mensili del fatturato sono +1%, +1% e +1%. Quale frase è corretta?","options":["Il fatturato cresce con tasso costante","Il fatturato è stabile","Non conosciamo il segno della sua evoluzione"],"correct":0,"why":"Un tasso mensile costante positivo segnala aumento in ciascun mese.","source":"QUIZ STATISTICA.pdf · p. 4","sourceType":"archived","adapted":false},{"id":"arc-031","chapter":2,"q":"Un indice semplice del prezzo di un bene, basato su prezzi positivi, risulta pari a −120. Come va interpretato?","options":["Il prezzo è diminuito del 20%","Il risultato è impossibile e segnala un errore","Il prezzo è più alto in un’altra città"],"correct":1,"why":"Il rapporto tra due prezzi strettamente positivi non può essere negativo.","source":"QUIZ STATISTICA.pdf · p. 4","sourceType":"archived","adapted":false},{"id":"arc-032","chapter":7,"q":"Ad agosto 2020, per la fascia 25–34 anni, i disoccupati sono il 15,6% delle forze di lavoro e l’11,1% della popolazione. Qual è il tasso di disoccupazione?","options":["15,6%","Non è determinabile","11,1%"],"correct":0,"why":"È la percentuale dei disoccupati sul totale delle forze di lavoro.","source":"QUIZ STATISTICA.pdf · p. 4","sourceType":"archived","adapted":false},{"id":"arc-033","chapter":3,"q":"Ad agosto 2020 l’inflazione acquisita è pari allo 0%, mentre quella congiunturale è +0,3% e quella tendenziale è −0,5%. Se i prezzi restano invariati fino a dicembre, quale sarà la variazione media annua?","options":["−0,5%","+0,3%","0%"],"correct":2,"why":"La definizione di inflazione acquisita ipotizza proprio prezzi costanti da quel mese fino a dicembre.","source":"QUIZ STATISTICA.pdf · p. 4","sourceType":"archived","adapted":false},{"id":"arc-034","chapter":3,"q":"Nel 2020 il NIC medio vale 102,7 e a dicembre vale 102,6. L’inflazione trasmessa dal 2020 rispetto all’inflazione ereditata dal 2019 è:","options":["Superiore","Inferiore","Approssimativamente uguale, considerando anche NIC 2019 medio 102,9 e dicembre 102,8"],"correct":2,"why":"La trasmessa è 102,6/102,7−1; l’ereditata è 102,8/102,9−1: i due valori coincidono approssimativamente.","source":"QUIZ STATISTICA.pdf · p. 4","sourceType":"archived","adapted":true},{"id":"arc-035","chapter":3,"q":"La variazione percentuale del NIC al netto dei beni energetici e degli alimentari freschi è:","options":["L’inflazione di fondo","L’inflazione propria","L’inflazione acquisita"],"correct":0,"why":"La misura core esclude energetici e alimentari non lavorati.","source":"QUIZ STATISTICA.pdf · p. 5","sourceType":"archived","adapted":false},{"id":"arc-036","chapter":3,"q":"Nel 2021 il NIC medio era 104,7 e l’indice di dicembre 106,6. Sapendo che dicembre 2020 valeva 102,6 e la media 2020 valeva 102,7, com’è l’inflazione ereditata dal 2020 rispetto alla trasmessa dal 2021?","options":["Inferiore","Uguale","Superiore"],"correct":0,"why":"L’ereditata è 102,6/102,7−1 (lievemente negativa), mentre la trasmessa è 106,6/104,7−1 (positiva).","source":"QUIZ STATISTICA.pdf · p. 5","sourceType":"archived","adapted":true},{"id":"arc-037","chapter":3,"q":"Ad agosto 2021 l’inflazione acquisita è +1,7%, la congiunturale +0,4% e la tendenziale +2,0%. Se i prezzi non cambiano più fino a dicembre, l’inflazione media 2021 sarà:","options":["+0,4%","+2,0%","+1,7%"],"correct":2,"why":"La variazione acquisita è il tasso medio annuale che si avrebbe mantenendo l’indice dell’ultimo mese disponibile.","source":"QUIZ STATISTICA.pdf · p. 5","sourceType":"archived","adapted":false},{"id":"arc-038","chapter":3,"q":"Nel 2018 il NIC medio e il NIC di dicembre valevano entrambi 102,3; la media 2017 valeva circa 101,1 e dicembre 2017 era 101,2. L’inflazione ereditata dal 2017 rispetto a quella trasmessa dal 2018 era:","options":["Uguale","Superiore","Inferiore"],"correct":1,"why":"La trasmessa 2018 è zero, perché dicembre 2018 coincide con la media 2018; l’ereditata 2017 è positiva (101,2/101,1−1).","source":"QUIZ STATISTICA.pdf · p. 5","sourceType":"archived","adapted":true},{"id":"arc-039","chapter":3,"q":"A settembre 2022 l’inflazione congiunturale è +0,3%, la tendenziale +8,9% e l’acquisita +7,1%. Se da ottobre a dicembre i prezzi rimangono fermi, l’inflazione media del 2022 sarà:","options":["+8,9%","+7,1%","+0,3%"],"correct":1,"why":"In assenza di ulteriori variazioni mensili, l’inflazione dell’anno coincide con l’acquisita.","source":"QUIZ STATISTICA.pdf · p. 5","sourceType":"archived","adapted":false},{"id":"arc-040","chapter":3,"q":"Il tasso di inflazione annuo medio del 2019 calcolato dal NIC è:","options":["La media delle variazioni tendenziali dei 12 mesi","La media delle variazioni congiunturali","La variazione percentuale tra la media degli indici mensili 2019 e quella degli indici mensili 2018"],"correct":2,"why":"Il tasso medio annuo confronta le medie degli indici, non le medie aritmetiche dei singoli tassi mensili.","source":"QUIZ STATISTICA.pdf · p. 5","sourceType":"archived","adapted":false},{"id":"arc-041","chapter":3,"q":"A luglio 2021 l’inflazione acquisita è +1,6%, quella congiunturale è +0,5% e quella tendenziale +1,9%. Senza variazioni mensili ulteriori nell’anno, l’inflazione 2021 sarebbe:","options":["+1,6%","+0,5%","+1,9%"],"correct":0,"why":"Per definizione, l’acquisita è la variazione media annua che risulterebbe da prezzi costanti negli ultimi mesi.","source":"QUIZ STATISTICA.pdf · p. 6","sourceType":"archived","adapted":false},{"id":"arc-042","chapter":3,"q":"Nel 2019 il NIC medio valeva 102,9 e a dicembre 102,8; nel 2018 NIC medio e di dicembre erano 102,3. L’inflazione trasmessa 2019 rispetto all’ereditata 2018 era:","options":["Inferiore","Uguale","Superiore"],"correct":0,"why":"La trasmessa 2019 è 102,8/102,9−1, negativa; l’ereditata 2018 è 102,3/102,3−1=0.","source":"QUIZ STATISTICA.pdf · p. 7","sourceType":"archived","adapted":true},{"id":"arc-043","chapter":7,"q":"Ad agosto 2021, per la fascia 15–24 anni, l’incidenza dei disoccupati sulle forze di lavoro è 27,3% e sulla popolazione è 6,7%. Qual è il tasso di disoccupazione?","options":["Non si può calcolare","27,3%","6,7%"],"correct":1,"why":"Il tasso di disoccupazione è la percentuale di disoccupati sulle forze di lavoro.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 1","sourceType":"archived","adapted":false},{"id":"arc-044","chapter":7,"q":"A settembre 2020, per la fascia 15–24 anni, la quota di disoccupati sulle forze di lavoro è 29,7%, mentre sulla popolazione è 7,2%. Quanto vale il tasso di disoccupazione?","options":["29,7%","Non si può calcolare","7,2%"],"correct":0,"why":"Il tasso di disoccupazione usa come denominatore le forze di lavoro.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 1","sourceType":"archived","adapted":false},{"id":"arc-045","chapter":9,"q":"La spesa media pro capite nel 2019 è 1.095 € e nel 2020 è 1.002 €; il NIC è 102,9 nel 2019 e 102,7 nel 2020. Quale formula calcola la variazione REALE della spesa pro capite?","options":["[(1.002/1.095) × (102,9/102,7) − 1] × 100","[(1.002/1.095) − 1] × 100","[(102,7/102,9) − 1] × 100"],"correct":0,"why":"Per la variazione reale si divide l’indice di valore monetario per l’indice di prezzo: (1.002/1.095)/(102,7/102,9)−1.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 1","sourceType":"archived","adapted":true},{"id":"arc-046","chapter":3,"q":"Il NIC vale 101,2 a dicembre 2017 e 102,3 a dicembre 2018; il FOI vale rispettivamente 101,1 e 102,1. Quale formula calcola l’inflazione tendenziale di dicembre 2018 misurata dal NIC?","options":["Non è calcolabile","(102,3/101,2 − 1) × 100","(102,1/101,1 − 1) × 100"],"correct":1,"why":"L’inflazione tendenziale del NIC confronta l’indice NIC di dicembre con dicembre dell’anno prima. Il FOI non va usato.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-047","chapter":4,"q":"Per misurare l’effettivo cambiamento della produzione industriale rispetto alla base 2015, quale serie bisogna privilegiare?","options":["Indice grezzo senza correzioni","Indice destagionalizzato e corretto per gli effetti di calendario","Indice dei prezzi dei prodotti industriali"],"correct":1,"why":"Le correzioni di calendario e stagionalità permettono il confronto della dinamica produttiva eliminando effetti periodici.","source":"Tutti quiz 1° esonero stat ec..pdf · p. 4","sourceType":"archived","adapted":true},{"id":"arc-050","chapter":6,"q":"Nel 2018 il PIL nominale è 1.771,4 e nel 2019 è 1.789,7 (miliardi). Quale espressione calcola la variazione percentuale nominale del PIL nel 2019?","options":["(1.789,7/1.771,4 − 1) × 100","(1.789,7−1.771,4) × 100","(1.771,4/1.789,7 − 1) × 100"],"correct":0,"why":"Per calcolare la variazione nominale annuale si usa il rapporto PIL corrente / PIL precedente meno 1.","source":"QUIZ STATISTICA.pdf · p. 9","sourceType":"archived","adapted":true},{"id":"arc-051","chapter":6,"q":"Nel 2018 il PIL a valori concatenati è 1.661,2 e nel 2019 è 1.670,3. Quale formula calcola la variazione REALE del PIL nel 2019?","options":["(1.670,3/1.661,2 − 1) × 100","(1.789,7/1.771,4 − 1) × 100","(1.789,7/1.661,2 − 1) × 100"],"correct":0,"why":"La crescita reale si calcola sui dati concatenati, non sui valori correnti.","source":"QUIZ STATISTICA.pdf · p. 9","sourceType":"archived","adapted":true},{"id":"arc-052","chapter":6,"q":"Il PIL nominale vale 1.789,7 nel 2019 e 1.771,4 nel 2018; il PIL concatenato 1.670,3 e 1.661,2. Quale formula fornisce la variazione del deflatore implicito?","options":["{[(1.789,7/1.670,3)/(1.771,4/1.661,2)] − 1} × 100","[(1.789,7/1.771,4) − 1] × 100","[(1.670,3/1.661,2) − 1] × 100"],"correct":0,"why":"Occorre calcolare i due deflatori (PIL nominale/PIL reale), poi la variazione percentuale del loro rapporto.","source":"QUIZ STATISTICA.pdf · p. 9","sourceType":"archived","adapted":true},{"id":"arc-053","chapter":9,"q":"Tra 2017 e 2018 la spesa media familiare a prezzi correnti passa da 2.564 € a 2.571 €. Quale espressione calcola la variazione NOMINALE?","options":["(2.571/2.564 − 1) × 100","(2.564/2.571 − 1) × 100","(2.571−2.564)/100"],"correct":0,"why":"La variazione nominale usa il rapporto tra le spese monetarie nei due anni, senza deflazionare.","source":"QUIZ STATISTICA.pdf · p. 10","sourceType":"archived","adapted":true},{"id":"arc-054","chapter":9,"q":"Nel 2017 la spesa media familiare è 2.564 € (NIC=101,1); nel 2018 è 2.571 € (NIC=102,3). Quale espressione calcola la variazione REALE della spesa?","options":["[(2.571/2.564)/(102,3/101,1) − 1] × 100","(2.571/2.564 − 1) × 100","(102,3/101,1 − 1) × 100"],"correct":0,"why":"Il rapporto tra valori monetari deve essere deflazionato mediante il rapporto tra indici NIC.","source":"QUIZ STATISTICA.pdf · p. 11","sourceType":"archived","adapted":true},{"id":"arc-055","chapter":9,"q":"La spesa media mensile è 2.560 € nel 2019 e 2.328 € nel 2020. Qual è la formula per la variazione nominale percentuale del 2020?","options":["(2.328/2.560 − 1) × 100","(2.560/2.328 − 1) × 100","(2.328−2.560) × 100"],"correct":0,"why":"Si confronta il valore corrente con quello precedente, sottraendo 1.","source":"QUIZ STATISTICA.pdf · p. 12","sourceType":"archived","adapted":true},{"id":"arc-056","chapter":9,"q":"La spesa media mensile familiare nel 2020 era 2.328 € e il NIC 102,7. Quale formula riporta la spesa ai prezzi dell’anno base 2015?","options":["2.328 × (100/102,7)","2.328 × (102,7/100)","2.328 − 102,7"],"correct":0,"why":"Per deflazionare un valore monetario rispetto all’anno base con indice 100 si moltiplica per 100/NIC.","source":"QUIZ STATISTICA.pdf · p. 12","sourceType":"archived","adapted":true},{"id":"arc-057","chapter":9,"q":"La spesa media mensile nel 2020 è 2.328 € (NIC 102,7); quanto vale ai prezzi del 2019, quando il NIC era 102,9?","options":["2.328 × (102,9/102,7)","2.328 × (102,7/102,9)","2.328 × (102,7/100)"],"correct":0,"why":"Per esprimere il valore monetario del 2020 in prezzi 2019 si usa il rapporto NIC2019/NIC2020.","source":"QUIZ STATISTICA.pdf · p. 13","sourceType":"archived","adapted":true},{"id":"arc-058","chapter":5,"q":"Una produzione industriale ha indice grezzo 72,0, indice corretto per calendario 73,0 e destagionalizzato 73,2. Quale variazione percentuale rispetto a base 100 corrisponde alla serie corretta e destagionalizzata?","options":["−26,8%","−27,0%","−28,0%"],"correct":0,"why":"La differenza rispetto a 100 dell’indice destagionalizzato 73,2 è −26,8%.","source":"QUIZ STATISTICA.pdf · p. 13","sourceType":"archived","adapted":true},{"id":"arc-059","chapter":9,"q":"Se la spesa media pro capite del 2017 è 1.085 € e quella del 2018 è 1.095 €, quale formula fornisce la crescita nominale nel 2018?","options":["(1.095/1.085 − 1) × 100","(1.085/1.095 − 1) × 100","1.095−1.085"],"correct":0,"why":"La crescita percentuale è il rapporto tra valore finale e iniziale meno 1.","source":"QUIZ STATISTICA.pdf · p. 14","sourceType":"archived","adapted":true},{"id":"arc-060","chapter":9,"q":"Nel 2020 il NIC vale 102,7 e nel 2019 102,9; una spesa nominale 2020 di 1.002 € a quanto equivale ai prezzi 2019?","options":["1.002 × (102,9/102,7)","1.002 × (102,7/102,9)","1.002 × (102,9/100)"],"correct":0,"why":"Si rimuove il livello dei prezzi del 2020 e si applica il livello dei prezzi del 2019.","source":"QUIZ STATISTICA.pdf · p. 14","sourceType":"archived","adapted":true},{"id":"arc-061","chapter":3,"q":"Per il NIC, un tasso di inflazione tendenziale è stato pari a −0,1% e la variazione congiunturale +0,6%. Quale dei due misura la variazione rispetto allo stesso mese dell’anno precedente?","options":["Il −0,1% tendenziale","Il +0,6% congiunturale","La loro somma"],"correct":0,"why":"La variazione tendenziale usa lo stesso mese dell’anno precedente; la congiunturale usa il mese immediatamente precedente.","source":"QUIZ STATISTICA.pdf · p. 7","sourceType":"archived","adapted":true},{"id":"arc-062","chapter":9,"q":"Nel 2020 la soglia di povertà relativa per una famiglia di due persone è 1.002 € e l’intensità è 21,4%. Qual è il consumo medio equivalente delle famiglie povere?","options":["1.002 × (1 − 0,214)","1.002 × (1 + 0,214)","2.328 × (1 − 0,214)"],"correct":0,"why":"Dall’intensità I=(z−ȳ)/z si ricava ȳ=z(1−I). Nei quiz d’esame è sufficiente identificare la formula.","source":"quiz ultimo capitolo.pdf · p. 1","sourceType":"archived","adapted":true},{"id":"arc-063","chapter":9,"q":"Nel 2021 l’incidenza familiare della povertà relativa è 11,1%, l’intensità 21,7%. Qual è la quota di famiglie relativamente povere?","options":["11,1%","21,7%","Non si può ricavare"],"correct":0,"why":"L’incidenza esprime direttamente la proporzione delle famiglie al di sotto della soglia.","source":"quiz ultimo capitolo.pdf · p. 1","sourceType":"archived","adapted":false},{"id":"arc-065","chapter":7,"q":"Nel 2022 l’errore standard della spesa media familiare è 13,1 € per l’Italia e 26,1 € per il Nord-Ovest. Quale spiegazione è plausibile?","options":["Il campione del Nord-Ovest è meno numeroso","Le risposte del Nord-Ovest sono necessariamente meno sincere","La spesa media del Nord-Ovest è più alta"],"correct":0,"why":"La stima territoriale usa generalmente un sottoinsieme più piccolo della rilevazione nazionale, e questo può aumentare l’incertezza campionaria.","source":"quiz ultimo capitolo.pdf · p. 1","sourceType":"archived","adapted":false},{"id":"arc-066","chapter":7,"q":"La stima della spesa media familiare nel 2020 è 2.328 € e il coefficiente di variazione è 0,5%. Quale intervallo di confidenza al 95% è impostato correttamente?","options":["[2.328 − 1,96×0,005; 2.328 + 1,96×0,005]","[2.328 − 1,96×2.328×0,005; 2.328 + 1,96×2.328×0,005]","[2.328 − 1,96×0,5; 2.328 + 1,96×0,5]"],"correct":1,"why":"Prima ricavi SE = 2.328×0,005, poi calcoli stima ± 1,96×SE. Nella foto originale la seconda alternativa aveva un refuso, corretto qui.","source":"quiz ultimo capitolo.pdf · p. 1","sourceType":"archived","adapted":true},{"id":"arc-067","chapter":7,"q":"La spesa media familiare stimata nel 2021 è 2.437 € e il suo errore relativo è 0,5%. Qual è l’intervallo al 95% correttamente impostato?","options":["[2.437 − 1,96×2.437×0,005; 2.437 + 1,96×2.437×0,005]","[2.437 − 1,96×0,5; 2.437 + 1,96×0,5]","[2.437 − 1,96×0,005; 2.437 + 1,96×0,005]"],"correct":0,"why":"L’errore standard è stima×CV. Correzione dei simboli errati presenti nella fonte originale.","source":"quiz ultimo capitolo.pdf · p. 1","sourceType":"archived","adapted":true},{"id":"arc-068","chapter":9,"q":"Nel 2019 l’incidenza della povertà relativa familiare è 11,4% e l’intensità 23,8%. Quante famiglie, in percentuale, sono povere?","options":["23,8%","Non è definibile","11,4%"],"correct":2,"why":"La percentuale delle famiglie povere coincide per definizione con l’incidenza H.","source":"quiz ultimo capitolo.pdf · p. 1","sourceType":"archived","adapted":false},{"id":"arc-069","chapter":9,"q":"Nel 2019 la soglia di povertà per una famiglia di due componenti è 1.095 € e l’intensità è 23,8%. Quale formula dà il consumo medio dei poveri?","options":["1.095 × (1 + 0,238)","1.095 × (1 − 0,238)","2.560 × (1 − 0,238)"],"correct":1,"why":"Si ricava ȳ=z(1−I) dalla definizione di intensità, senza usare la spesa media di tutte le famiglie.","source":"quiz ultimo capitolo.pdf · p. 2","sourceType":"archived","adapted":true},{"id":"arc-070","chapter":9,"q":"Nel 2020 l’incidenza della povertà relativa familiare era 10,1% e l’intensità 21,4%. La percentuale di famiglie povere è:","options":["10,1%","Non si può determinare","21,4%"],"correct":0,"why":"È già espressa dall’indice di incidenza, che conta le unità povere sul totale.","source":"quiz ultimo capitolo.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-071","chapter":7,"q":"Per la spesa media familiare nel 2022 l’errore standard era 13,1 € per l’Italia e 29,7 € per il Sud. Quale causa può spiegare la differenza?","options":["Il valore medio più basso del Sud","Un errore di rilevazione necessariamente più grave nel Sud","La dimensione del campione del Sud è più piccola di quella nazionale"],"correct":2,"why":"A parità di altre condizioni, un campione di dimensione inferiore può produrre un errore standard superiore.","source":"quiz ultimo capitolo.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-073","chapter":7,"q":"Per un reddito annuo familiare stimato a 38.649 €, con errore relativo dello 0,8%, quale intervallo di confidenza al 95% è corretto?","options":["[38.649 − 1,96×0,8; 38.649 + 1,96×0,8]","[38.649 − 1,96×38.649×0,008; 38.649 + 1,96×38.649×0,008]","[38.649 − 1,96×0,008; 38.649 + 1,96×0,008]"],"correct":1,"why":"CV=0,008, quindi SE=38.649×0,008; l’intervallo è la stima ± 1,96×SE.","source":"quiz ultimo capitolo.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-074","chapter":9,"q":"Nel 2018 la soglia relativa è 1.095 € e l’intensità della povertà è 24,3%. Quale formula dà il consumo medio equivalente dei poveri?","options":["Non è possibile ricavarlo","2.571 × (1−0,243)","1.095 × (1−0,243)"],"correct":2,"why":"La media dei poveri è il complemento dell’intensità rispetto alla soglia di povertà: ȳ=z(1−I).","source":"quiz ultimo capitolo.pdf · p. 2","sourceType":"archived","adapted":true},{"id":"arc-075","chapter":7,"q":"Nel 2022 l’errore standard della spesa media familiare è 13,1 € per l’Italia e 31,3 € per il Nord-Est. Quale possibile spiegazione è più solida?","options":["La qualità dei dati nel Nord-Est è necessariamente peggiore","La stima Nord-Est è più elevata","Il campione Nord-Est è meno numeroso di quello italiano"],"correct":2,"why":"La numerosità del campione può spiegare la maggiore incertezza della stima territoriale.","source":"quiz ultimo capitolo.pdf · p. 2","sourceType":"archived","adapted":false},{"id":"arc-076","chapter":8,"q":"I valori 15, 20, 30 e 45 rappresentano le ALTEZZE di quattro ragazzi. Nel senso di concentrazione economica definito nella dispensa, l’indice di Gini:","options":["È pari a 0,33","Non è interpretabile come indice di concentrazione di un carattere trasferibile","È pari a 0,80"],"correct":1,"why":"Le altezze non sono trasferibili tra unità. Si può calcolare un indice numerico di disuguaglianza, ma non la concentrazione economica nel senso studiato.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-077","chapter":8,"q":"I REDDITI di quattro soggetti sono 15, 20, 30 e 45. Quanto vale circa l’indice di concentrazione di Gini normalizzato della dispensa?","options":["0,30","Non è definito","0,08","0,80"],"correct":0,"why":"Totale=110. Quote cumulate: 15/110, 35/110, 65/110. R=1−(2/3)×(115/110)=0,3030. La foto originale proponeva 0,33, valore non esatto per questi dati.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-078","chapter":8,"q":"Il fatturato (in migliaia di euro) di cinque imprese è 50, 60, 65, 70 e 300. Quale risultato descrive meglio il Gini normalizzato della dispensa?","options":["Circa 0,47","Non è definito, perché il fatturato non è trasferibile","Circa 0,05"],"correct":0,"why":"Il fatturato totale è 545; la formula R=1−(2/4)×[(50+110+175+245)/545] dà circa 0,468. Nelle foto la risposta «0,5» è ammissibile solo come arrotondamento a una cifra decimale.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-079","chapter":8,"q":"Sono rilevate le altezze (cm) 150, 160, 162, 165 e 168. Quale affermazione è corretta sulla concentrazione economica di Gini?","options":["Non è definita nel senso di carattere trasferibile","È necessariamente 0,01","È esattamente 0,10"],"correct":0,"why":"L’altezza è una variabile quantitativa non trasferibile: l’indice di concentrazione della dispensa non è appropriato.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-080","chapter":8,"q":"Le età di quattro persone sono 25, 30, 46 e 52 anni. Per la concentrazione di Gini nell’accezione economica della dispensa:","options":["L’indice è necessariamente 0,8","L’indice è esattamente 0,2","Il carattere non è trasferibile e la concentrazione non è interpretabile"],"correct":2,"why":"Non è possibile trasferire anni di età da una persona a un’altra.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-081","chapter":2,"q":"Siano pᵢ₀, qᵢ₀ i prezzi e quantità iniziali, e pᵢ₁, qᵢ₁ quelli finali. L’espressione (Σpᵢ₁qᵢ₁)/(Σpᵢ₀qᵢ₀) identifica:","options":["Un indice di quantità","Un indice di prezzo","Un indice di valore","Nessuna delle precedenti"],"correct":2,"why":"Cambiano contemporaneamente prezzi e quantità, quindi si confrontano gli ammontari di valore complessivi.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-082","chapter":2,"q":"L’espressione (Σpᵢ₁qᵢ₀)/(Σpᵢ₀qᵢ₀) rappresenta:","options":["Un indice dei prezzi di Laspeyres","Un indice delle quantità di Paasche","Un indice di valore"],"correct":0,"why":"L’indice di Laspeyres mantiene fisse le quantità base q₀ e confronta prezzi correnti e iniziali.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-083","chapter":3,"q":"L’inflazione dei prezzi interni è +5% e quella dei prezzi esteri è +3%. Che cosa possiamo dire?","options":["I prezzi interni sono sicuramente più alti di quelli esteri","I prezzi esteri sono sicuramente più alti dei prezzi interni","I prezzi interni sono aumentati più rapidamente di quelli esteri","Non è possibile confrontare i tassi"],"correct":2,"why":"I tassi indicano la velocità di variazione, non i livelli assoluti di prezzo.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-084","chapter":3,"q":"Il tasso NIC tendenziale è +1,5% mentre l’inflazione di fondo è +0,8%. Che cosa indica il confronto?","options":["Le componenti più volatili hanno sostenuto l’inflazione generale","Le componenti volatili hanno contenuto la misura generale","I prezzi energetici sono cresciuti esattamente dello 0,7%","Le due misure sono equivalenti"],"correct":0,"why":"La variazione complessiva maggiore di quella al netto delle componenti volatili indica che tali componenti hanno spinto verso l’alto la variazione generale.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-085","chapter":3,"q":"Nel dicembre 2018 il FOI senza tabacchi è 102,1 e nel dicembre 2019 è 102,5. Quale formula indica l’aumento percentuale di un canone rivalutato integralmente al FOI?","options":["(102,5/102,1 − 1) × 100","102,5 − 102,1","102,5/100"],"correct":0,"why":"La rivalutazione percentuale si misura con il rapporto tra l’indice finale e quello iniziale, meno uno.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-086","chapter":3,"q":"Nel 2016 l’IPCA con base 2015=100 vale 100,2 nell’Area Euro e 99,9 in Italia. Da questi soli numeri possiamo dire in quale territorio i PREZZI siano più alti?","options":["Sì, in Italia erano inferiori","No, questi numeri non permettono un confronto dei livelli assoluti dei prezzi","Sì, in Italia erano superiori"],"correct":1,"why":"Un numero indice del livello 2015=100 misura variazioni temporali rispetto al proprio paniere, non livelli assoluti di prezzo confrontabili fra aree.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-087","chapter":3,"q":"L’IPCA 2018 nell’Area Euro cresce dell’1,9% rispetto al 2017 e quello italiano dell’1,2%. Possiamo affermare che i livelli dei prezzi italiani siano inferiori?","options":["Sì, erano inferiori","No, non abbiamo informazioni sufficienti sui livelli dei prezzi","Sì, erano superiori"],"correct":1,"why":"Differenze tra tassi di aumento non implicano differenze determinate tra livelli assoluti.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-088","chapter":3,"q":"L’IPCA europeo vale 106 con base 2015=100 e quello italiano vale 103 con base 2010=100. Possiamo usare il confronto diretto 106 contro 103 per misurare una diversa inflazione annuale?","options":["Sì, 6% e 3% sono necessariamente i tassi annuali","No, basi diverse e mancanza del periodo iniziale pertinente impediscono il confronto","Sì, i due indici misurano il 100%"],"correct":1,"why":"I livelli di due indici con basi temporali differenti non rappresentano tassi annuali confrontabili.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-089","chapter":3,"q":"Un IPCA passa da 100,2 a 102 in due anni consecutivi. Quale formula permette di ricavare la variazione percentuale annua?","options":["102 − 100,2","(102/100,2 − 1) × 100","102"],"correct":1,"why":"La crescita percentuale è calcolata rispetto al valore precedente. La differenza di 1,8 punti indice non coincide con la percentuale.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-090","chapter":3,"q":"In un prospetto il tasso annuo dell’IPCA 2017 è indicato come +1,7%. Quale valore identifica il tasso pubblicato?","options":["Il livello dell’indice 102","La differenza di 1,8 punti indice","+1,7%"],"correct":2,"why":"Quando il tasso annuale è già fornito lo si legge direttamente. Attenzione: indici arrotondati a una cifra possono produrre una variazione calcolata non identica al tasso pubblicato.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-091","chapter":4,"q":"Per le variazioni congiunturali dell’indice della produzione industriale, quali trasformazioni eliminano gli effetti periodici?","options":["Solo la correzione per il calendario","Solo la destagionalizzazione","Correzione per il calendario e destagionalizzazione","Deflazione dei salari"],"correct":2,"why":"Si elimina sia l’effetto dei giorni lavorativi sia quello delle ricorrenze stagionali.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-092","chapter":6,"q":"Il PIL nominale passa da 1.771,4 nel 2018 a 1.789,7 nel 2019. Quale formula è la variazione percentuale annua?","options":["(1.789,7/1.771,4 − 1) × 100","(1.670,3/1.661,2 − 1) × 100","(1.789,7/1.670,3 − 1) × 100"],"correct":0,"why":"Il tasso nominale utilizza in entrambi gli anni il PIL a prezzi correnti, senza mescolarlo con il concatenato.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":true},{"id":"arc-093","chapter":6,"q":"Tra 2017 e 2018 il PIL a prezzi correnti e quello concatenato cambiano. Come possiamo isolare la componente dovuta alle variazioni dei prezzi?","options":["Con la variazione del solo PIL nominale","Con la differenza tra i PIL in euro","Con il rapporto tra indice di valore e indice di volume"],"correct":2,"why":"L’indice dei prezzi impliciti si ottiene dividendo l’indice di valore per quello di volume.","source":"Fotografie di prove condivise in chat","sourceType":"archived","adapted":false},{"id":"arc-094","chapter":6,"q":"Per ottenere la variazione REALE del reddito disponibile in due anni, disponendo di reddito nominale e deflatore dei consumi, bisogna:","options":["Rapportare le variazioni del reddito nominale e del deflatore dei consumi","Calcolare soltanto il tasso del reddito nominale","Confrontare solo i valori del deflatore"],"correct":0,"why":"Indice reale = indice nominale / indice dei prezzi; la variazione reale è il ra
